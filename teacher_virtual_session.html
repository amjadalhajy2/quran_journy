<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة الإقراء الافتراضية - بوابة المعلم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> 
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap'); 
        body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; } 
        
        .book-container {
            width: 100%; height: 100%; perspective: 2500px; position: relative;
            background-color: #ffffff; box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.1);
        }
        .book-spine {
            position: absolute; top: 0; bottom: 0; left: 50%; width: 50px; transform: translateX(-50%);
            background: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.05) 45%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.05) 55%, transparent 100%);
            z-index: 20; pointer-events: none;
        }
        .page { flex: 1; position: relative; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1), filter 0.5s; background-color: #ffffff; }
        .page-right { transform-origin: left center; }
        .page-left { transform-origin: right center; }
        .turning-next .page-left { transform: rotateY(90deg); filter: brightness(0.7); }
        .turning-prev .page-right { transform: rotateY(-90deg); filter: brightness(0.7); }
        .quran-img { width: 100%; height: 100%; object-fit: fill; mix-blend-mode: multiply; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-200">
    
    <!-- القائمة الجانبية المصغرة -->
    <aside class="w-16 md:w-20 bg-gray-900 flex flex-col items-center py-6 border-l border-gray-800 z-10 shadow-2xl">
        <a href="teacher_dashboard.html" class="text-gray-400 hover:text-white mb-8 transition" title="العودة">
            <i class="fas fa-sign-out-alt text-2xl text-red-400 hover:text-red-500"></i>
        </a>
    </aside>

    <main class="flex-1 flex flex-col md:flex-row">
        
        <!-- قسم المصحف -->
        <div class="flex-1 lg:w-2/3 bg-[#1e293b] p-2 flex flex-col relative border-l border-gray-800">
            <div class="flex-1 w-full rounded-md flex overflow-hidden mb-2">
                <div id="bookContainer" class="book-container rounded-md flex w-full group">
                    <div class="book-spine"></div>
                    <button onclick="changePage(-2)" class="absolute right-0 top-0 bottom-0 w-24 hover:bg-gradient-to-l from-black/20 to-transparent flex items-center justify-start pr-4 z-40 transition opacity-0 group-hover:opacity-100 cursor-pointer">
                        <i class="fas fa-chevron-right text-5xl text-gray-800 opacity-50 hover:opacity-100 transition drop-shadow-md"></i>
                    </button>
                    <button onclick="changePage(2)" class="absolute left-0 top-0 bottom-0 w-24 hover:bg-gradient-to-r from-black/20 to-transparent flex items-center justify-end pl-4 z-40 transition opacity-0 group-hover:opacity-100 cursor-pointer">
                        <i class="fas fa-chevron-left text-5xl text-gray-800 opacity-50 hover:opacity-100 transition drop-shadow-md"></i>
                    </button>
                    <div class="page page-right border-l border-gray-300">
                        <img id="rightPageImage" src="" class="quran-img" alt="يمنى">
                    </div>
                    <div class="page page-left">
                        <img id="leftPageImage" src="" class="quran-img" alt="يسرى">
                    </div>
                    <div id="loadingOverlay" class="absolute inset-0 bg-white/90 flex items-center justify-center z-50 hidden rounded-md">
                        <i class="fas fa-circle-notch fa-spin text-5xl text-gray-400"></i>
                    </div>
                </div>
            </div>

            <!-- التحكم بالمصحف -->
            <div class="w-full bg-gray-800 rounded-lg p-2 flex justify-center items-center shadow-md border border-gray-700 z-30">
                <div class="flex items-center space-x-2 space-x-reverse">
                    <select id="surahIndexSelect" class="bg-gray-900 border border-gray-600 rounded px-4 py-2 text-sm text-emerald-400 font-bold outline-none cursor-pointer" onchange="jumpToPage(this.value)">
                        <option value="">الفهرس...</option>
                    </select>
                    <div class="flex items-center bg-gray-900 rounded px-3 py-1.5 border border-gray-600">
                        <span class="text-xs text-gray-400 ml-2">صفحة:</span>
                        <input type="number" id="pageNumberInput" value="1" min="1" max="603" step="2"
                               class="w-14 bg-transparent text-white font-bold text-center outline-none" onchange="jumpToPage(this.value)">
                    </div>
                </div>
            </div>
        </div>

        <!-- قسم الفيديو والمتابعة المحدث -->
        <div class="w-full lg:w-[450px] xl:w-[500px] bg-gray-900 flex flex-col shadow-2xl z-20">
            <!-- الهيدر -->
            <div class="p-4 border-b border-gray-800 bg-gray-900">
                <div class="flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-white text-lg" id="studentNameDisplay">جاري التحميل...</h3>
                        <p class="text-xs text-emerald-400 font-bold" id="teacherNameDisplay">المعلم: جاري التحميل...</p>
                    </div>
                    <span class="bg-red-500 text-white text-xs px-2 py-1 rounded animate-pulse font-bold flex items-center">
                        <i class="fas fa-circle text-[8px] ml-1"></i> مباشر
                    </span>
                </div>
            </div>

            <!-- زر جوجل ميت -->
            <div id="meet-container" class="w-full h-auto bg-gray-900 relative shadow-inner border-b border-gray-800 flex flex-col items-center justify-center p-6 text-center">
                <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl w-full">
                    <i class="fas fa-video text-4xl text-blue-500 mb-3 animate-pulse"></i>
                    <h4 class="text-lg font-bold text-white mb-2">غرفة الاتصال المرئي</h4>
                    <button onclick="openMeetPopup()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition w-full shadow-lg flex items-center justify-center cursor-pointer text-sm">
                        <i class="fas fa-external-link-square-alt ml-2"></i> فتح الكاميرا (Google Meet)
                    </button>
                </div>
            </div>

            <!-- حقول التقييم والتسجيل للحصة -->
            <div class="flex-1 p-4 bg-gray-800 flex flex-col overflow-y-auto space-y-4">
                
                <div class="bg-gray-900 p-3 rounded-lg border border-gray-700">
                    <select id="selectCurriculum" onchange="onCurriculumChange()" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-sm font-bold text-white outline-none focus:border-emerald-500 mb-3"></select>
                    
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <!-- عمود: المطلوب -->
                        <div class="bg-blue-900/20 p-2 rounded border border-blue-800/50">
                            <label class="block text-[11px] font-bold text-blue-400 mb-2">المطلوب</label>
                            <div class="flex flex-col space-y-2">
                                <div class="flex items-center"><span class="text-xs text-gray-400 w-6 text-right">من</span><input type="number" id="targetFrom" onchange="handleTargetFromChange()" class="w-full bg-gray-800 text-white rounded p-1 outline-none focus:border-blue-500 text-center text-sm border border-gray-600 font-bold" required></div>
                                <div class="flex items-center"><span class="text-xs text-gray-400 w-6 text-right">إلى</span><input type="number" id="targetTo" onchange="syncActualRange()" class="w-full bg-gray-800 text-white rounded p-1 outline-none focus:border-blue-500 text-center text-sm border border-gray-600 font-bold" required></div>
                            </div>
                        </div>

                        <!-- عمود: الفعلي -->
                        <div class="bg-emerald-900/20 p-2 rounded border border-emerald-800/50">
                            <label class="block text-[11px] font-bold text-emerald-400 mb-2">الفعلي</label>
                            <div class="flex flex-col space-y-2">
                                <div class="flex items-center"><span class="text-xs text-gray-400 w-6 text-right">من</span><input type="number" id="actualFrom" class="w-full bg-gray-800 text-white rounded p-1 outline-none focus:border-emerald-500 text-center text-sm border border-gray-600 font-bold"></div>
                                <div class="flex items-center"><span class="text-xs text-gray-400 w-6 text-right">إلى</span><input type="number" id="actualTo" class="w-full bg-gray-800 text-white rounded p-1 outline-none focus:border-emerald-500 text-center text-sm border border-gray-600 font-bold"></div>
                            </div>
                        </div>

                        <!-- عمود: للقادمة -->
                        <div class="bg-purple-900/20 p-2 rounded border border-purple-800/50">
                            <label class="block text-[11px] font-bold text-purple-400 mb-2">للقادمة</label>
                            <div class="flex flex-col space-y-2">
                                <div class="flex items-center"><span class="text-xs text-gray-400 w-6 text-right">من</span><input type="number" id="nextFrom" onchange="handleNextFromChange()" class="w-full bg-gray-800 text-white rounded p-1 outline-none focus:border-purple-500 text-center text-sm border border-gray-600 font-bold disabled:opacity-40 disabled:cursor-not-allowed"></div>
                                <div class="flex items-center"><span class="text-xs text-gray-400 w-6 text-right">إلى</span><input type="number" id="nextTo" class="w-full bg-gray-800 text-white rounded p-1 outline-none focus:border-purple-500 text-center text-sm border border-gray-600 font-bold disabled:opacity-40 disabled:cursor-not-allowed"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex-1 flex flex-col min-h-[90px]">
                    <label class="block text-xs font-bold text-gray-400 mb-1">ملاحظات المعلم والتوجيهات</label>
                    <textarea id="sessionNotes" class="flex-1 w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white outline-none focus:border-emerald-500 resize-none" placeholder="اكتب ملاحظاتك وتوجيهاتك للطالب هنا..."></textarea>
                </div>

                <button onclick="saveAndEndSession()" id="finishBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition w-full shadow-lg">
                    حفظ السجل وإنهاء الحصة
                </button>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        let myMeetLink = ""; 
        let activeSessionId = null;
        let studentPlans = [];
        window.quranChapters = [];

        const juzPageBounds = {
            1:[1,21], 2:[22,41], 3:[42,61], 4:[62,81], 5:[82,101], 6:[102,121], 7:[122,141], 8:[142,161], 9:[162,181], 10:[182,201],
            11:[202,221], 12:[222,241], 13:[242,261], 14:[262,281], 15:[282,301], 16:[302,321], 17:[322,341], 18:[342,361], 19:[362,381], 20:[382,401],
            21:[402,421], 22:[422,441], 23:[442,461], 24:[462,481], 25:[482,501], 26:[502,521], 27:[522,541], 28:[542,561], 29:[562,581], 30:[582,604]
        };

        function openMeetPopup() {
            if (!myMeetLink) return alert("لم يتم العثور على رابط Google Meet مخصص لك في النظام.");
            const width = 800; const height = 600;
            const left = (window.screen.width - width) / 2;
            const top = (window.screen.height - height) / 2;
            window.open(myMeetLink, "GoogleMeetWindow", `width=${width},height=${height},top=${top},left=${left},menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes`);
        }

        async function loadSurahsIndex() {
            try {
                const response = await fetch('https://api.quran.com/api/v4/chapters?language=ar');
                const data = await response.json();
                window.quranChapters = data.chapters;
                const select = document.getElementById('surahIndexSelect');
                select.innerHTML = '<option value="">-- الفهرس --</option>';
                data.chapters.forEach(surah => {
                    select.innerHTML += `<option value="${surah.pages[0]}">${surah.id}. سورة ${surah.name_arabic}</option>`;
                });
            } catch (error) { console.error(error); }
        }

        let currentPage = 1;
        const rightImage = document.getElementById('rightPageImage');
        const leftImage = document.getElementById('leftPageImage');
        const bookContainer = document.getElementById('bookContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');

        function getImageUrl(pageNum) { return `quran-low/${String(pageNum + 4).padStart(3, '0')}.jpg`; }

        function preloadImages(pageNum) {
            [pageNum - 2, pageNum - 1, pageNum + 2, pageNum + 3].forEach(p => {
                if (p >= 1 && p <= 604) { const img = new Image(); img.src = getImageUrl(p); }
            });
        }

        function updateQuranPage(pageNum) {
            if (pageNum % 2 === 0) pageNum -= 1; 
            if (pageNum < 1) pageNum = 1;
            if (pageNum > 603) pageNum = 603; 
            
            const oldPage = currentPage;
            currentPage = pageNum;
            document.getElementById('pageNumberInput').value = currentPage;

            if (currentPage !== oldPage) bookContainer.classList.add(currentPage > oldPage ? 'turning-next' : 'turning-prev');

            setTimeout(() => {
                loadingOverlay.classList.remove('hidden'); 
                let loaded = 0;
                const onImageLoad = () => {
                    loaded++;
                    if (loaded === 2) {
                        loadingOverlay.classList.add('hidden');
                        bookContainer.classList.remove('turning-next', 'turning-prev');
                        preloadImages(currentPage);
                    }
                };

                rightImage.onload = onImageLoad; rightImage.onerror = () => { rightImage.src = getImageUrl(currentPage); };
                rightImage.src = getImageUrl(currentPage);

                if (currentPage + 1 <= 604) {
                    leftImage.onload = onImageLoad; leftImage.onerror = () => { leftImage.src = getImageUrl(currentPage + 1); };
                    leftImage.src = getImageUrl(currentPage + 1);
                } else { leftImage.src = ""; onImageLoad(); }
            }, currentPage === oldPage ? 0 : 400); 
        }

        function changePage(direction) { updateQuranPage(currentPage + direction); }
        function jumpToPage(val) { if(val) updateQuranPage(parseInt(val)); }

        // دوال التحكم بنطاقات الحفظ
        function handleTargetFromChange() {
            const sel = document.getElementById('selectCurriculum');
            if(!sel.value) return;
            const opt = sel.options[sel.selectedIndex];
            const maxP = parseInt(opt.getAttribute('data-max'));
            const tf = parseInt(document.getElementById('targetFrom').value) || 1;
            let tt = tf + 1;
            if(tt > maxP) tt = maxP;
            document.getElementById('targetTo').value = tt;
            syncActualRange();
        }

        function handleNextFromChange() {
            const sel = document.getElementById('selectCurriculum');
            if(!sel.value) return;
            const opt = sel.options[sel.selectedIndex];
            const maxP = parseInt(opt.getAttribute('data-max'));
            const nf = parseInt(document.getElementById('nextFrom').value) || 1;
            let nt = nf + 1;
            if(nt > maxP) nt = maxP;
            document.getElementById('nextTo').value = nt;
        }

        function onCurriculumChange() {
            const sel = document.getElementById('selectCurriculum');
            if(!sel.value) return;
            const opt = sel.options[sel.selectedIndex];
            const minP = parseInt(opt.getAttribute('data-min'));
            const maxP = parseInt(opt.getAttribute('data-max'));
            
            const tf = document.getElementById('targetFrom');
            const tt = document.getElementById('targetTo');
            
            tf.min = minP; tf.max = maxP; 
            if (!tf.value || parseInt(tf.value) < minP || parseInt(tf.value) > maxP) tf.value = minP;
            
            tt.min = minP; tt.max = maxP; 
            tt.value = parseInt(tf.value) + 1;
            if (parseInt(tt.value) > maxP) tt.value = maxP;

            // تحديث نطاق (القادمة)
            const nf = document.getElementById('nextFrom');
            const nt = document.getElementById('nextTo');
            nf.min = minP; nf.max = maxP;
            nt.min = minP; nt.max = maxP;

            syncActualRange();
        }

        function syncActualRange() {
            const tf = document.getElementById('targetFrom').value;
            const tt = document.getElementById('targetTo').value;
            const af = document.getElementById('actualFrom');
            const at = document.getElementById('actualTo');
            
            // حصر الحفظ الفعلي ضمن نطاق المطلوب
            af.min = tf; af.max = tt;
            at.min = tf; at.max = tt;
        }

        async function initializeRoom() {
            const { data: { user } } = await window.supabase.auth.getUser();
            if(!user) return window.location.href = 'login.html';

            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');

            let studentName = "طالب (بدون تحديد)";
            let studentId = null;

            const { data: teacherData } = await window.supabase.from('users').select('meet_link').eq('id', user.id).single();
            if(teacherData) myMeetLink = teacherData.meet_link || "";

            if (sessionId) {
                const { data: sessData } = await window.supabase.from('sessions')
                    .select('*, users!sessions_student_id_fkey(full_name)')
                    .eq('id', sessionId).single();
                
                if (sessData) {
                    studentId = sessData.student_id;
                    studentName = sessData.users?.full_name || studentName;
                    activeSessionId = sessData.id;

                    if (sessData.status === 'scheduled') {
                        await window.supabase.from('sessions').update({ status: 'ongoing' }).eq('id', activeSessionId);
                    }

                    // التحقق من وجود حصة قادمة مجدولة
                    const { data: nextSessions } = await window.supabase.from('sessions')
                        .select('id')
                        .eq('student_id', studentId)
                        .eq('teacher_id', user.id)
                        .eq('status', 'scheduled')
                        .neq('id', activeSessionId)
                        .order('session_date', {ascending: true})
                        .limit(1);

                    const hasNextSession = nextSessions && nextSessions.length > 0;
                    if (!hasNextSession) {
                        const nf = document.getElementById('nextFrom');
                        const nt = document.getElementById('nextTo');
                        nf.disabled = true; nt.disabled = true;
                        nf.title = "لا يوجد حصة قادمة مجدولة للطالب";
                        nt.title = "لا يوجد حصة قادمة مجدولة للطالب";
                    }

                    const { data: profile } = await window.supabase.from('student_profiles')
                        .select('target_parts, custom_plan_type, target_surahs')
                        .eq('user_id', studentId).single();

                    if(profile) {
                        try {
                            if (profile.target_parts && profile.target_parts.startsWith('[')) {
                                studentPlans = JSON.parse(profile.target_parts);
                            } else if (profile.target_parts || profile.target_surahs) {
                                let pType = profile.custom_plan_type || (profile.target_parts ? 'parts' : 'surahs');
                                let pItems = [];
                                if (pType === 'parts' && profile.target_parts) {
                                    pItems = profile.target_parts.split(/[،,]/).map(s=>s.trim()).filter(Boolean);
                                } else if (pType === 'surahs' && profile.target_surahs) {
                                    pItems = profile.target_surahs.split(/[،,]/).map(s=>s.trim().replace(/^\d+\.\s*/, '')).filter(Boolean);
                                }
                                studentPlans = [{ id: 1, type: pType, items: pItems }];
                            }
                        } catch(e) { console.error(e); }

                        const sel = document.getElementById('selectCurriculum');
                        sel.innerHTML = '<option value="">-- اختر من مقررات الطالب --</option>';

                        studentPlans.forEach(plan => {
                            const itemsStr = plan.items.join('، ');
                            let planMinPage = 604, planMaxPage = 1;
                            
                            plan.items.forEach(item => {
                                let bounds = null;
                                if(plan.type === 'parts') {
                                    const jNum = parseInt(item.replace(/\D/g,''));
                                    bounds = juzPageBounds[jNum];
                                } else {
                                    const ch = window.quranChapters?.find(c => c.name_arabic === item);
                                    if(ch) bounds = ch.pages;
                                }
                                if(bounds) {
                                    planMinPage = Math.min(planMinPage, bounds[0]);
                                    planMaxPage = Math.max(planMaxPage, bounds[1]);
                                }
                            });
                            
                            const lbl = `مقرر ${plan.id} (${itemsStr}) - ص ${planMinPage} إلى ${planMaxPage}`;
                            sel.innerHTML += `<option value="${plan.id}" data-plan="مقرر ${plan.id}" data-min="${planMinPage}" data-max="${planMaxPage}">${lbl}</option>`;
                        });

                        // تعبئة البيانات إن وجدت مسبقاً
                        if(sessData.next_assignment && sessData.next_assignment.includes('ص')) {
                            const matchName = sessData.next_assignment.match(/مقرر (\d+)/);
                            if(matchName) sel.value = matchName[1];
                            onCurriculumChange();
                            const nums = sessData.next_assignment.match(/ص (\d+) إلى (\d+)/);
                            if (nums) {
                                document.getElementById('targetFrom').value = nums[1];
                                document.getElementById('targetTo').value = nums[2];
                            }
                        } else if (sel.options.length > 1) {
                            sel.selectedIndex = 1;
                            onCurriculumChange();
                        }
                        
                        document.getElementById('actualFrom').value = '';
                        document.getElementById('actualTo').value = '';

                        if (sessData.memorized_from && sessData.memorized_from.includes('ص')) {
                            const numsAct = sessData.memorized_from.match(/ص (\d+) إلى (\d+)/);
                            if (numsAct) {
                                document.getElementById('actualFrom').value = numsAct[1];
                                document.getElementById('actualTo').value = numsAct[2];
                            }
                        }

                        if (sessData.teacher_notes) {
                            document.getElementById('sessionNotes').value = sessData.teacher_notes;
                        }
                    }
                }
            } else {
                alert("يرجى الدخول للغرفة من خلال الضغط على موعد الحصة في الجدول الخاص بك.");
            }
            
            document.getElementById('teacherNameDisplay').textContent = `المعلم: ${user.user_metadata?.full_name || "معلم"}`;
            document.getElementById('studentNameDisplay').textContent = `الطالب: ${studentName}`;
        }

        async function saveAndEndSession() {
            if(!activeSessionId) return alert("لا توجد حصة مجدولة لحفظ السجل فيها.");
            const btn = document.getElementById('finishBtn');
            btn.disabled = true; btn.textContent = 'جاري الحفظ...';

            const sel = document.getElementById('selectCurriculum');
            const opt = sel.options[sel.selectedIndex];
            const tf = document.getElementById('targetFrom').value;
            const tt = document.getElementById('targetTo').value;
            const af = document.getElementById('actualFrom').value;
            const at = document.getElementById('actualTo').value;
            const nf = document.getElementById('nextFrom').value;
            const nt = document.getElementById('nextTo').value;
            const notes = document.getElementById('sessionNotes').value;

            let targetStr = '', actualStr = '';
            if(sel.value) {
                targetStr = `${opt.getAttribute('data-plan')} - ص ${tf} إلى ${tt}`;
                
                // حفظ المقرر القادم إن وجد في نفس الخانة للمراجعة
                if (!document.getElementById('nextFrom').disabled && nf && nt) {
                    targetStr += ` | للقادمة: ص ${nf} إلى ${nt}`;
                }
                
                if (af && at) actualStr = `ص ${af} إلى ${at}`;
            }

            const { error } = await window.supabase.from('sessions').update({
                next_assignment: targetStr, memorized_from: actualStr, teacher_notes: notes, status: 'completed', evaluation: null
            }).eq('id', activeSessionId);

            if(error) { alert("خطأ: " + error.message); btn.disabled = false; btn.textContent = 'حفظ السجل وإنهاء الحصة'; }
            else window.location.href = 'teacher_dashboard.html';
        }

        window.addEventListener('load', async () => {
            await loadSurahsIndex(); 
            updateQuranPage(1);
            initializeRoom();  
        });
    </script>
</body>
</html>
