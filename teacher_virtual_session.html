<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة الإقراء الافتراضية - بوابة المعلم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> 
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap'); 
        body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; } 
        #jitsi-container iframe { border-radius: 0.5rem; border: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://meet.jit.si/external_api.js"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-200">
    
    <aside class="w-20 bg-gray-900 flex flex-col items-center py-6 border-l border-gray-800 z-10 shadow-2xl">
        <a href="teacher_dashboard.html" class="text-gray-400 hover:text-white mb-8 transition" title="إنهاء الحصة والعودة للرئيسية">
            <i class="fas fa-sign-out-alt text-2xl text-red-400 hover:text-red-500"></i>
        </a>
        <div class="flex-1"></div>
        <div class="text-xs text-gray-500 font-bold rotate-180" style="writing-mode: vertical-rl;">
            مِـنَـصَّـةُ التِّـلَاوَةِ
        </div>
    </aside>

    <main class="flex-1 flex flex-col md:flex-row">
        
        <!-- مساحة المصحف التفاعلي -->
        <div class="flex-1 bg-[#1e293b] p-4 flex flex-col relative border-l border-gray-800">
            <div class="bg-gray-800 rounded-lg p-3 flex justify-between items-center mb-4 shadow-md border border-gray-700">
                <div class="font-bold text-emerald-400 flex items-center">
                    <i class="fas fa-quran ml-2 text-xl"></i> مصحف المدينة (Hafs Assim)
                </div>
                
                <div class="flex items-center space-x-2 space-x-reverse">
                    
                    <!-- الفهرس الذكي -->
                    <select id="surahIndexSelect" class="bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm text-emerald-400 outline-none cursor-pointer font-bold" onchange="jumpToPage(this.value)">
                        <option value="">جاري تحميل الفهرس...</option>
                    </select>

                    <button onclick="changePage(-1)" class="bg-gray-700 hover:bg-emerald-700 px-3 py-2 rounded font-bold text-sm transition text-white shadow">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                    
                    <div class="flex items-center bg-gray-900 rounded px-2 py-1 border border-gray-600">
                        <span class="text-xs text-gray-400 ml-1">صفحة:</span>
                        <input type="number" id="pageNumberInput" value="1" min="1" max="604" 
                               class="w-12 bg-transparent text-white font-bold text-center outline-none"
                               onchange="jumpToPage(this.value)">
                    </div>
                    
                    <button onclick="changePage(1)" class="bg-gray-700 hover:bg-emerald-700 px-3 py-2 rounded font-bold text-sm transition text-white shadow">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex-1 bg-[#fdfbf7] rounded-xl overflow-hidden flex items-center justify-center border-4 border-gray-700 relative shadow-inner">
                <!-- صورة المصحف -->
                <img id="quranPageImage" src="" class="h-full object-contain p-2" alt="صفحة المصحف">
                <div id="loadingOverlay" class="absolute inset-0 bg-[#fdfbf7] flex items-center justify-center">
                    <i class="fas fa-spinner fa-spin text-4xl text-emerald-600"></i>
                </div>
            </div>
        </div>

        <!-- منطقة الاتصال المرئي ومعلومات الطالب -->
        <div class="w-full md:w-[450px] bg-gray-900 flex flex-col shadow-2xl">
            <div class="p-4 border-b border-gray-800 bg-gray-900">
                <div class="flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-white text-lg" id="studentNameDisplay">جاري التحميل...</h3>
                        <p class="text-xs text-emerald-400 font-bold" id="teacherNameDisplay">المعلم: جاري التحميل...</p>
                    </div>
                    <span class="bg-red-500 text-white text-xs px-2 py-1 rounded animate-pulse font-bold flex items-center">
                        <i class="fas fa-circle text-[8px] ml-1"></i> مباشر
                    </span>
                </div>
            </div>

            <div id="jitsi-container" class="w-full h-[50vh] bg-black relative shadow-inner">
                <div id="jitsi-loader" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500">
                    <i class="fas fa-video text-4xl mb-3 animate-bounce"></i>
                    <p class="font-bold text-sm">جاري إنشاء وتشفير الغرفة المرئية...</p>
                </div>
            </div>

            <div class="flex-1 p-4 bg-gray-800 flex flex-col">
                <h4 class="font-bold text-gray-300 text-sm mb-3 border-b border-gray-700 pb-2">
                    <i class="fas fa-pen ml-2 text-emerald-500"></i> ملاحظات المعلم للحصة الحالية
                </h4>
                <textarea class="flex-1 w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-gray-200 outline-none focus:border-emerald-500 resize-none" placeholder="اكتب ملاحظاتك عن تلاوة الطالب هنا..."></textarea>
                <button class="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition w-full shadow-lg">
                    حفظ الملاحظات وإنهاء الحصة
                </button>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        // 1. جلب فهرس السور (نستخدم mp3quran للفهرس فقط لأنه لا يسبب حظراً)
        async function loadSurahsIndex() {
            try {
                const response = await fetch('https://mp3quran.net/api/v3/suwar?language=ar');
                const data = await response.json();
                
                const select = document.getElementById('surahIndexSelect');
                select.innerHTML = '<option value="">-- فهرس السور --</option>';
                
                data.suwar.forEach(surah => {
                    select.innerHTML += `<option value="${surah.start_page}">${surah.id}. سورة ${surah.name}</option>`;
                });
            } catch (error) {
                console.error("حدث خطأ في جلب فهرس السور: ", error);
            }
        }

        // 2. نظام جلب صور المصحف حصراً من مسار (open-mushaf-native)
        let currentPage = 1;
        const pageImageElement = document.getElementById('quranPageImage');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const pageInput = document.getElementById('pageNumberInput');
        const surahSelect = document.getElementById('surahIndexSelect');

        function updateQuranPage(pageNum) {
            if (pageNum < 1) pageNum = 1;
            if (pageNum > 604) pageNum = 604;
            
            currentPage = pageNum;
            pageInput.value = currentPage;
            loadingOverlay.classList.remove('hidden'); 
            
            // القاعدة الأساسية في مسار Github أن تكون أرقام الصور 1.png, 2.png ..الخ
            let imageUrl = `https://cdn.jsdelivr.net/gh/adelpro/open-mushaf-native@master/assets/mushaf-data/mushaf-elmadina-hafs-assim/${currentPage}.png`;
            
            pageImageElement.onload = () => {
                loadingOverlay.classList.add('hidden');
                Array.from(surahSelect.options).forEach(opt => {
                    if(opt.value && parseInt(opt.value) <= currentPage) {
                        surahSelect.value = opt.value;
                    }
                });
            };

            // معالجة الخطأ المزدوجة (لو كان المشروع يستخدم صيغة 001.png بدلاً من 1.png)
            pageImageElement.onerror = () => {
                if(!imageUrl.includes('00')) {
                    // المحاولة الثانية: إضافة أصفار للرقم
                    const formattedNum = String(currentPage).padStart(3, '0');
                    imageUrl = `https://cdn.jsdelivr.net/gh/adelpro/open-mushaf-native@master/assets/mushaf-data/mushaf-elmadina-hafs-assim/${formattedNum}.png`;
                    pageImageElement.src = imageUrl;
                } else {
                    loadingOverlay.classList.add('hidden');
                    console.error("المسار غير صحيح أو الصور غير متوفرة في هذا المجلد.");
                }
            };

            // بدء جلب الصورة
            pageImageElement.src = imageUrl;
        }

        function changePage(direction) {
            updateQuranPage(currentPage + direction);
        }

        function jumpToPage(val) {
            if(val) updateQuranPage(parseInt(val));
        }

        // 3. نظام الغرفة الصوتية والمرئية (Jitsi API)
        let api = null;
        async function initializeRoom() {
            const { data: { user } } = await window.supabase.auth.getUser();
            if(!user) return window.location.href = 'login.html';

            const teacherName = user.user_metadata?.full_name || "معلم القرآن";
            document.getElementById('teacherNameDisplay').textContent = `المعلم: ${teacherName}`;

            const urlParams = new URLSearchParams(window.location.search);
            const studentId = urlParams.get('student_id');
            
            let studentName = "غرفة عامة (بانتظار أي طالب)";
            let roomName = `Tilawah_Teacher_${user.id.substring(0,10)}`; 

            if (studentId) {
                const { data: studentData } = await window.supabase.from('users').select('full_name').eq('id', studentId).single();
                if (studentData) {
                    studentName = studentData.full_name;
                    document.getElementById('studentNameDisplay').textContent = `الطالب: ${studentName}`;
                    roomName = `Tilawah_Room_${user.id.substring(0,8)}_${studentId.substring(0,8)}`;
                }
            } else {
                document.getElementById('studentNameDisplay').textContent = studentName;
            }

            const domain = 'meet.jit.si';
            const options = {
                roomName: roomName,
                width: '100%',
                height: '100%',
                parentNode: document.querySelector('#jitsi-container'),
                userInfo: { displayName: teacherName, role: 'moderator' },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                    disableModeratorIndicator: true,
                    disableDeepLinking: true, 
                    prejoinPageEnabled: false 
                },
                interfaceConfigOverwrite: {
                    TOOLBAR_BUTTONS: ['microphone', 'camera', 'desktop', 'fullscreen', 'chat', 'settings'],
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_WATERMARK_FOR_GUESTS: false
                }
            };
            
            document.getElementById('jitsi-loader').style.display = 'none';
            api = new JitsiMeetExternalAPI(domain, options);
        }

        window.addEventListener('load', () => {
            loadSurahsIndex(); 
            updateQuranPage(1);
            initializeRoom();  
        });
    </script>
</body>
</html>
