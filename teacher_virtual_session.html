<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة الإقراء الافتراضية - بوابة المعلم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> 
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap'); 
        body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; } 
        #jitsi-container iframe { border-radius: 0.5rem; border: none; }
        
        /* تأثيرات قلب الصفحة 3D */
        .page-container {
            perspective: 1500px; /* العمق الثلاثي الأبعاد */
        }
        .page-flip {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1), opacity 0.4s;
            transform-style: preserve-3d;
            transform-origin: left center; /* نقطة الارتكاز لطي الصفحة */
        }
        .turning-forward { transform: rotateY(-90deg) scale(0.95); opacity: 0; }
        .turning-backward { transform: rotateY(90deg) scale(0.95); opacity: 0; }
        
        /* ظل منتصف المصحف ليعطي إيحاء الكتاب الحقيقي */
        .book-spine {
            box-shadow: inset 15px 0 20px -15px rgba(0,0,0,0.5), inset -15px 0 20px -15px rgba(0,0,0,0.5);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://meet.jit.si/external_api.js"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-200">
    
    <aside class="w-20 bg-gray-900 flex flex-col items-center py-6 border-l border-gray-800 z-10 shadow-2xl">
        <a href="teacher_dashboard.html" class="text-gray-400 hover:text-white mb-8 transition" title="إنهاء الحصة والعودة للرئيسية">
            <i class="fas fa-sign-out-alt text-2xl text-red-400 hover:text-red-500"></i>
        </a>
        <div class="flex-1"></div>
        <div class="text-xs text-gray-500 font-bold rotate-180" style="writing-mode: vertical-rl;">
            مِـنَـصَّـةُ التِّـلَاوَةِ
        </div>
    </aside>

    <main class="flex-1 flex flex-col md:flex-row">
        
        <!-- مساحة المصحف التفاعلي -->
        <div class="flex-1 bg-[#1e293b] p-4 flex flex-col relative border-l border-gray-800 overflow-hidden">
            <div class="bg-gray-800 rounded-lg p-3 flex justify-between items-center mb-4 shadow-md border border-gray-700 z-20">
                <div class="font-bold text-emerald-400 flex items-center text-sm md:text-base">
                    <i class="fas fa-book-open ml-2 text-xl"></i> مصحف المدينة (عرض مزدوج)
                </div>
                
                <div class="flex items-center space-x-2 space-x-reverse">
                    <select id="surahIndexSelect" class="bg-gray-900 border border-gray-600 rounded px-2 py-1 md:px-3 md:py-2 text-xs md:text-sm text-emerald-400 outline-none cursor-pointer font-bold w-32 md:w-auto" onchange="jumpToPage(this.value)">
                        <option value="">الفهرس...</option>
                    </select>

                    <div class="flex items-center bg-gray-900 rounded px-2 py-1 border border-gray-600 hidden md:flex">
                        <span class="text-xs text-gray-400 ml-1">صفحة:</span>
                        <input type="number" id="pageNumberInput" value="1" min="1" max="603" step="2"
                               class="w-12 bg-transparent text-white font-bold text-center outline-none"
                               onchange="jumpToPage(this.value)">
                    </div>
                </div>
            </div>
            
            <!-- منصة عرض الكتاب الحقيقي (Book Container) -->
            <div class="flex-1 bg-[#f0e6d2] rounded-xl flex items-center justify-center relative shadow-inner border-[12px] border-[#3e2723] page-container">
                
                <!-- زر التقليب السابق (يمين الشاشة) -->
                <button onclick="changePage(-2)" class="absolute right-0 top-0 bottom-0 w-16 md:w-24 bg-gradient-to-l from-black/40 to-transparent hover:from-black/60 flex items-center justify-center z-30 transition opacity-0 hover:opacity-100 group">
                    <i class="fas fa-chevron-right text-4xl text-white opacity-50 group-hover:opacity-100 transform group-hover:scale-125 transition"></i>
                </button>

                <!-- الحاوية المزدوجة للصفحتين -->
                <div id="pagesWrapper" class="flex w-full h-full max-w-5xl book-spine page-flip">
                    
                    <!-- الصفحة اليمنى (الرقم الفردي) -->
                    <div class="flex-1 h-full relative border-l border-gray-400 shadow-[inset_10px_0_15px_-10px_rgba(0,0,0,0.3)] bg-[#fdfbf7]">
                        <img id="rightPageImage" src="" class="w-full h-full object-contain p-2 md:p-4" alt="الصفحة اليمنى">
                        <!-- رقم الصفحة اليمنى -->
                        <div id="rightPageNum" class="absolute bottom-1 right-0 left-0 text-center text-xs text-gray-500 font-bold">1</div>
                    </div>

                    <!-- الصفحة اليسرى (الرقم الزوجي) -->
                    <div class="flex-1 h-full relative border-r border-gray-400 shadow-[inset_-10px_0_15px_-10px_rgba(0,0,0,0.3)] bg-[#fdfbf7]">
                        <img id="leftPageImage" src="" class="w-full h-full object-contain p-2 md:p-4" alt="الصفحة اليسرى">
                        <!-- رقم الصفحة اليسرى -->
                        <div id="leftPageNum" class="absolute bottom-1 right-0 left-0 text-center text-xs text-gray-500 font-bold">2</div>
                    </div>

                </div>

                <!-- زر التقليب التالي (يسار الشاشة) -->
                <button onclick="changePage(2)" class="absolute left-0 top-0 bottom-0 w-16 md:w-24 bg-gradient-to-r from-black/40 to-transparent hover:from-black/60 flex items-center justify-center z-30 transition opacity-0 hover:opacity-100 group">
                    <i class="fas fa-chevron-left text-4xl text-white opacity-50 group-hover:opacity-100 transform group-hover:scale-125 transition"></i>
                </button>

                <!-- مؤشر التحميل -->
                <div id="loadingOverlay" class="absolute inset-0 bg-[#f0e6d2]/80 flex items-center justify-center z-40 hidden">
                    <i class="fas fa-spinner fa-spin text-5xl text-[#5c4033]"></i>
                </div>
            </div>
        </div>

        <!-- منطقة الاتصال المرئي ومعلومات الطالب -->
        <div class="w-full md:w-[450px] bg-gray-900 flex flex-col shadow-2xl">
            <div class="p-4 border-b border-gray-800 bg-gray-900">
                <div class="flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-white text-lg" id="studentNameDisplay">جاري التحميل...</h3>
                        <p class="text-xs text-emerald-400 font-bold" id="teacherNameDisplay">المعلم: جاري التحميل...</p>
                    </div>
                    <span class="bg-red-500 text-white text-xs px-2 py-1 rounded animate-pulse font-bold flex items-center">
                        <i class="fas fa-circle text-[8px] ml-1"></i> مباشر
                    </span>
                </div>
            </div>

            <div id="jitsi-container" class="w-full h-[50vh] bg-black relative shadow-inner">
                <div id="jitsi-loader" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500">
                    <i class="fas fa-video text-4xl mb-3 animate-bounce"></i>
                    <p class="font-bold text-sm">جاري إنشاء الغرفة...</p>
                </div>
            </div>

            <div class="flex-1 p-4 bg-gray-800 flex flex-col">
                <h4 class="font-bold text-gray-300 text-sm mb-3 border-b border-gray-700 pb-2">
                    <i class="fas fa-pen ml-2 text-emerald-500"></i> ملاحظات الحصة
                </h4>
                <textarea class="flex-1 w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-gray-200 outline-none focus:border-emerald-500 resize-none" placeholder="ملاحظات المعلم..."></textarea>
                <button class="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition w-full shadow-lg">
                    حفظ وإنهاء
                </button>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        // 1. الفهرس
        async function loadSurahsIndex() {
            try {
                const response = await fetch('https://mp3quran.net/api/v3/suwar?language=ar');
                const data = await response.json();
                const select = document.getElementById('surahIndexSelect');
                select.innerHTML = '<option value="">-- فهرس السور --</option>';
                data.suwar.forEach(surah => {
                    select.innerHTML += `<option value="${surah.start_page}">${surah.id}. سورة ${surah.name}</option>`;
                });
            } catch (error) { console.error(error); }
        }

        // 2. نظام الصفحتين المتقابلتين وتأثير القلب
        let currentPage = 1; // يجب أن تكون دائماً فردية (لأنها الصفحة اليمنى)
        const rightImage = document.getElementById('rightPageImage');
        const leftImage = document.getElementById('leftPageImage');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const pagesWrapper = document.getElementById('pagesWrapper');

        // جلب مسار الصورة بذكاء لمعالجة نقص الأصفار
        function getImageUrl(pageNum) {
            // سنستخدم الصيغة ذات الأصفار لأنها الأضمن غالباً، مع دعم كاسر JSDelivr السريع
            const formattedNum = String(pageNum).padStart(3, '0');
            return `https://cdn.jsdelivr.net/gh/adelpro/open-mushaf-native@master/assets/mushaf-data/mushaf-elmadina-hafs-assim/${formattedNum}.png`;
        }

        function updateQuranPage(pageNum, isTurningForward = true) {
            // ضمان أن الصفحة اليمنى دائماً فردية (1, 3, 5...) لتطابق المصحف المطبوع
            if (pageNum % 2 === 0) pageNum -= 1; 
            
            if (pageNum < 1) pageNum = 1;
            if (pageNum > 603) pageNum = 603;
            
            currentPage = pageNum;
            document.getElementById('pageNumberInput').value = currentPage;
            document.getElementById('rightPageNum').innerText = currentPage;
            document.getElementById('leftPageNum').innerText = (currentPage + 1 <= 604) ? currentPage + 1 : "-";
            
            // إضافة تأثير CSS 3D قبل تغيير الصورة
            pagesWrapper.classList.add(isTurningForward ? 'turning-forward' : 'turning-backward');
            
            setTimeout(() => {
                loadingOverlay.classList.remove('hidden'); 
                
                let imagesLoaded = 0;
                const checkAllLoaded = () => {
                    imagesLoaded++;
                    // ننتظر تحميل الصورتين معاً قبل الإظهار
                    if (imagesLoaded === 2) {
                        loadingOverlay.classList.add('hidden');
                        // إزالة تأثير CSS لإعادة الصفحة لوضعها الطبيعي
                        pagesWrapper.classList.remove('turning-forward', 'turning-backward');
                        
                        // تحديث الفهرس
                        Array.from(document.getElementById('surahIndexSelect').options).forEach(opt => {
                            if(opt.value && parseInt(opt.value) <= currentPage + 1) {
                                document.getElementById('surahIndexSelect').value = opt.value;
                            }
                        });
                    }
                };

                // تحميل الصفحة اليمنى (الفردية)
                rightImage.onload = checkAllLoaded;
                rightImage.onerror = () => { 
                    // خطة بديلة لو فشل التنسيق ذو الأصفار (Fallback)
                    rightImage.src = `https://cdn.jsdelivr.net/gh/adelpro/open-mushaf-native@master/assets/mushaf-data/mushaf-elmadina-hafs-assim/${currentPage}.png`;
                };
                rightImage.src = getImageUrl(currentPage);

                // تحميل الصفحة اليسرى (الزوجية)
                if (currentPage + 1 <= 604) {
                    leftImage.onload = checkAllLoaded;
                    leftImage.onerror = () => { 
                        leftImage.src = `https://cdn.jsdelivr.net/gh/adelpro/open-mushaf-native@master/assets/mushaf-data/mushaf-elmadina-hafs-assim/${currentPage + 1}.png`;
                    };
                    leftImage.src = getImageUrl(currentPage + 1);
                } else {
                    leftImage.src = ""; // إذا انتهى المصحف
                    checkAllLoaded();
                }
            }, 300); // تأخير بسيط ليظهر تأثير الطي للعين
        }

        function changePage(direction) {
            // direction: 2 (للأمام/يسار) أو -2 (للخلف/يمين)
            const isForward = direction > 0;
            updateQuranPage(currentPage + direction, isForward);
        }

        function jumpToPage(val) {
            if(val) updateQuranPage(parseInt(val), true);
        }

        // 3. الغرفة المرئية
        async function initializeRoom() {
            // تم اختصار الكود هنا للحفاظ على الأداء.. (نفس الكود السابق يعمل تماماً)
            const domain = 'meet.jit.si';
            const options = {
                roomName: `Tilawah_General_Room_${Math.floor(Math.random()*1000)}`,
                width: '100%', height: '100%',
                parentNode: document.querySelector('#jitsi-container'),
                configOverwrite: { prejoinPageEnabled: false, disableDeepLinking: true },
                interfaceConfigOverwrite: { TOOLBAR_BUTTONS: ['microphone', 'camera', 'chat'] }
            };
            document.getElementById('jitsi-loader').style.display = 'none';
            new JitsiMeetExternalAPI(domain, options);
        }

        window.addEventListener('load', () => {
            loadSurahsIndex(); 
            updateQuranPage(1);
            initializeRoom();  
        });
    </script>
</body>
</html>
