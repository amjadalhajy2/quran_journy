<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير النظام - الطلاب المنتظمين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap'); body { font-family: 'Tajawal', sans-serif; background-color: #f4f7f6; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800 relative">
    <aside class="w-64 bg-[#1a2b3c] text-white flex flex-col hidden md:flex shadow-2xl z-20">
        <div class="p-6 text-xl font-bold border-b border-gray-700 flex items-center"><i class="fas fa-shield-alt text-emerald-400 mr-2 ml-2"></i> الإدارة العليا</div>
        <nav class="flex-1 p-4 space-y-2 text-sm font-medium">
            <a href="admin_dashboard.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-chart-pie ml-3"></i> لوحة المؤشرات</a>
            <a href="admin_teachers.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-chalkboard-teacher ml-3"></i> إدارة المعلمين</a>
            <a href="admin_new_registrations.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-user-plus ml-3"></i> طلبات التسجيل</a>
            <a href="admin_students.html" class="flex items-center bg-emerald-600 px-4 py-3 rounded-lg text-white shadow"><i class="fas fa-user-graduate ml-3"></i> إدارة الطلاب المنتظمين</a>
            <a href="admin_finances.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-file-invoice-dollar ml-3"></i> الإدارة المالية</a>
            <a href="admin_packages.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-box ml-3"></i> إدارة الباقات</a>
        </nav>
    </aside>
    <main class="flex-1 flex flex-col overflow-y-auto bg-gray-50">
        <header class="bg-white shadow-sm p-4 border-b flex justify-between items-center">
            <h2 class="text-2xl font-bold text-gray-700">الطلاب المنتظمين</h2>
        </header>
        <div class="p-8">
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-right text-sm">
                    <thead class="bg-gray-50 text-gray-500 border-b">
                        <tr>
                            <th class="px-6 py-4 font-bold">اسم الطالب وبياناته</th>
                            <th class="px-6 py-4 font-bold">المقرر الحالي</th>
                            <th class="px-6 py-4 font-bold text-center">نوع الباقة والحصص</th>
                            <th class="px-6 py-4 font-bold text-center">الحالة</th>
                            <th class="px-6 py-4 font-bold">المعلم المشرف</th>
                            <th class="px-6 py-4 font-bold text-center">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTable" class="divide-y divide-gray-100">
                        <tr><td colspan="6" class="px-6 py-8 text-center text-gray-500 font-bold">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- نافذة إسناد المعلم -->
    <div id="assignModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-sm">
            <h3 class="text-xl font-bold mb-4 text-emerald-700">تعيين معلم للطالب</h3>
            <input type="hidden" id="modalStudentId">
            <select id="teacherSelect" class="w-full border p-3 rounded-lg mb-4 font-bold outline-none"></select>
            <div class="flex space-x-2 space-x-reverse">
                <button onclick="saveTeacher()" class="w-full bg-emerald-600 hover:bg-emerald-700 transition text-white p-3 rounded-lg font-bold">حفظ التغيير</button>
                <button onclick="document.getElementById('assignModal').classList.add('hidden')" class="w-full bg-gray-200 hover:bg-gray-300 transition p-3 rounded-lg font-bold">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة تعديل بيانات الطالب -->
    <div id="editStudentModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-sm">
            <h3 class="text-xl font-bold mb-4 text-emerald-700">تعديل بيانات الطالب</h3>
            <form id="editStudentForm" class="space-y-4">
                <input type="hidden" id="editStudentId">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">اسم الطالب</label>
                    <input type="text" id="editStudentName" class="w-full border rounded-lg p-3 outline-none focus:border-emerald-500" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">رقم الهاتف / الواتساب</label>
                    <input type="tel" id="editStudentPhone" dir="ltr" class="w-full border rounded-lg p-3 outline-none text-right focus:border-emerald-500" required>
                </div>
                <div id="editStudentMsg" class="hidden text-sm font-bold p-2 text-center rounded"></div>
                <div class="flex space-x-2 space-x-reverse mt-4">
                    <button type="submit" id="saveEditBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 transition text-white p-3 rounded-lg font-bold">حفظ التعديلات</button>
                    <button type="button" onclick="document.getElementById('editStudentModal').classList.add('hidden')" class="w-full bg-gray-200 hover:bg-gray-300 transition p-3 rounded-lg font-bold">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script src="supabase.js"></script>
    <script>
        let teachersList = [];

        async function loadStudents() {
            const { data: teachers } = await window.supabase.from('users').select('id, full_name').eq('role', 'teacher');
            teachersList = teachers || [];

            const { data: profiles, error } = await window.supabase.rpc('get_enrolled_students');
            const { data: usersList } = await window.supabase.from('users').select('id, phone');
            const { data: subsList } = await window.supabase.from('subscriptions').select('student_id, packages(sessions_per_week)').eq('status', 'approved');
            const { data: sessionsList } = await window.supabase.from('sessions').select('student_id, status').eq('status', 'completed');

            if (error) {
                alert("حدث خطأ في قاعدة البيانات: " + error.message);
                return;
            }

            const tbody = document.getElementById('studentsTable');
            tbody.innerHTML = '';
            
            if(profiles && profiles.length > 0) {
                profiles.forEach(p => {
                    const user = usersList?.find(u => u.id === p.student_id);
                    const phone = user?.phone || 'غير متوفر';
                    const cleanPhone = phone !== 'غير متوفر' ? phone.replace(/\D/g, '') : '';
                    const waLink = cleanPhone ? `https://wa.me/${cleanPhone}` : '#';
                    const waHtml = cleanPhone ? `<a href="${waLink}" target="_blank" class="text-green-600 hover:text-green-800 transition inline-flex items-center"><i class="fab fa-whatsapp ml-1"></i> ${phone}</a>` : `<span class="text-gray-400">${phone}</span>`;

                    const sub = subsList?.find(s => s.student_id === p.student_id);
                    const totalSessions = sub?.packages?.sessions_per_week ? sub.packages.sessions_per_week * 4 : 0;
                    const usedSessions = sessionsList?.filter(s => s.student_id === p.student_id).length || 0;
                    const remainingSessions = Math.max(0, totalSessions - usedSessions);
                    const sessionsBadge = totalSessions > 0 ? `<div class="text-xs mt-1 text-gray-500 font-bold">متبقي: <span class="text-blue-600">${remainingSessions} من ${totalSessions}</span> حصة</div>` : '';

                    let planText = '<span class="text-orange-500 text-xs">بانتظار تقييم المعلم</span>';
                    if (p.custom_plan_type === 'parts') planText = `تلاوة ${p.target_parts} أجزاء`;
                    else if (p.custom_plan_type === 'surahs') planText = `سور: ${p.target_surahs}`;
                    else if (p.target_parts && p.target_parts.startsWith('[')) planText = `<span class="text-emerald-600 font-bold">خطة مخصصة متعددة</span>`;

                    const pkgName = p.package_name || 'غير معروف';
                    const statusBadge = p.sub_status === 'approved' 
                        ? '<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">نشط</span>' 
                        : `<span class="bg-gray-100 text-gray-700 px-2 py-1 rounded text-xs font-bold">${p.sub_status}</span>`;

                    const teacher = teachersList.find(t => t.id === p.teacher_id);
                    const teacherName = teacher ? teacher.full_name : '<span class="text-orange-500 font-bold">بانتظار التعيين</span>';

                    // تم تعديل اسم الطالب ليصبح رابط يفتح صفحة admin_student_details.html
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 border-b transition">
                            <td class="px-6 py-4">
                                <a href="admin_student_details.html?id=${p.student_id}" class="font-bold text-emerald-700 hover:underline flex items-center mb-1 text-lg">
                                    ${p.full_name} <i class="fas fa-external-link-alt text-[10px] ml-2 opacity-70"></i>
                                </a>
                                <div class="text-xs text-gray-400 mb-1">${p.email}</div>
                                <div class="text-xs font-bold" dir="ltr" style="text-align: right;">${waHtml}</div>
                            </td>
                            <td class="px-6 py-4 font-bold text-emerald-600">${planText}</td>
                            <td class="px-6 py-4 text-center">
                                <span class="bg-blue-50 text-blue-700 px-2 py-1 rounded font-bold text-xs block mx-auto w-max">${pkgName}</span>
                                ${sessionsBadge}
                            </td>
                            <td class="px-6 py-4 text-center">${statusBadge}</td>
                            <td class="px-6 py-4 font-bold text-gray-700">${teacherName}</td>
                            <td class="px-6 py-4 text-center flex flex-col space-y-2 w-max mx-auto">
                                <button onclick="openEditStudentModal('${p.student_id}', '${p.full_name}', '${phone}')" class="bg-blue-50 hover:bg-blue-100 text-blue-700 px-3 py-1.5 rounded font-bold transition flex items-center justify-center text-xs">
                                    <i class="fas fa-edit ml-1"></i> تعديل بيانات
                                </button>
                                <button onclick="openAssignModal('${p.student_id}', '${p.teacher_id || ''}')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded font-bold transition flex items-center justify-center text-xs">
                                    <i class="fas fa-exchange-alt ml-1"></i> نقل لمعلم
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } else { tbody.innerHTML = '<tr><td colspan="6" class="text-center p-12 text-gray-500 font-bold">لا يوجد طلاب منتظمين حالياً.</td></tr>'; }
        }

        function openAssignModal(studentId, currentTeacherId) {
            document.getElementById('modalStudentId').value = studentId;
            const select = document.getElementById('teacherSelect');
            select.innerHTML = '<option value="">-- اختر المعلم --</option>';
            teachersList.forEach(t => {
                const isSelected = t.id === currentTeacherId ? 'selected' : '';
                select.innerHTML += `<option value="${t.id}" ${isSelected}>${t.full_name}</option>`;
            });
            document.getElementById('assignModal').classList.remove('hidden');
            document.getElementById('assignModal').classList.add('flex');
        }

        async function saveTeacher() {
            const stuId = document.getElementById('modalStudentId').value;
            const tId = document.getElementById('teacherSelect').value;
            if(!tId) return alert('الرجاء اختيار معلم!');
            
            const { error } = await window.supabase.rpc('assign_teacher', { p_student_id: stuId, p_teacher_id: tId });
            if(error) alert('خطأ: ' + error.message);
            else {
                document.getElementById('assignModal').classList.add('hidden');
                loadStudents();
            }
        }

        function openEditStudentModal(id, name, phone) {
            document.getElementById('editStudentId').value = id;
            document.getElementById('editStudentName').value = name;
            document.getElementById('editStudentPhone').value = phone === 'غير متوفر' ? '' : phone;
            document.getElementById('editStudentMsg').classList.add('hidden');
            
            document.getElementById('editStudentModal').classList.remove('hidden');
            document.getElementById('editStudentModal').classList.add('flex');
        }

        document.getElementById('editStudentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveEditBtn');
            const msg = document.getElementById('editStudentMsg');
            btn.disabled = true; btn.textContent = 'جاري الحفظ...';

            const id = document.getElementById('editStudentId').value;
            const newName = document.getElementById('editStudentName').value;
            const newPhone = document.getElementById('editStudentPhone').value;

            const { error } = await window.supabase.rpc('update_teacher_info', { 
                p_user_id: id, 
                p_full_name: newName, 
                p_phone: newPhone, 
                p_meet_link: null 
            });

            msg.classList.remove('hidden');
            if(error) {
                msg.textContent = 'حدث خطأ: ' + error.message;
                msg.className = 'text-sm font-bold p-2 text-center rounded bg-red-50 text-red-600 block mt-2';
            } else {
                msg.textContent = 'تم تحديث بيانات الطالب بنجاح!';
                msg.className = 'text-sm font-bold p-2 text-center rounded bg-green-50 text-green-600 block mt-2';
                loadStudents();
                setTimeout(() => document.getElementById('editStudentModal').classList.add('hidden'), 1500);
            }
            btn.disabled = false; btn.textContent = 'حفظ التعديلات';
        });

        window.addEventListener('load', loadStudents);
    </script>
</body>
</html>
