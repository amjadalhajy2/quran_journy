<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير النظام - طلبات التسجيل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap'); body { font-family: 'Tajawal', sans-serif; background-color: #f4f7f6; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800 relative">
    
    <aside class="w-64 bg-[#1a2b3c] text-white flex flex-col hidden md:flex shadow-2xl z-20">
        <div class="p-6 text-xl font-bold border-b border-gray-700 flex items-center">
            <i class="fas fa-shield-alt text-emerald-400 mr-2 ml-2"></i> الإدارة العليا
        </div>
        <nav class="flex-1 p-4 space-y-2 text-sm font-medium">
            <a href="admin_dashboard.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-chart-pie ml-3"></i> لوحة المؤشرات</a>
            <a href="admin_teachers.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-chalkboard-teacher ml-3"></i> إدارة المعلمين</a>
            <a href="admin_new_registrations.html" class="flex items-center bg-emerald-600 px-4 py-3 rounded-lg text-white shadow"><i class="fas fa-user-plus ml-3"></i> طلبات التسجيل والتجديد</a>
            <a href="admin_students.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-user-graduate ml-3"></i> إدارة الطلاب المنتظمين</a>
            <a href="admin_finances.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-file-invoice-dollar ml-3"></i> الإدارة المالية</a>
            <a href="admin_packages.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-box ml-3"></i> إدارة الباقات</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto bg-gray-50">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center border-b z-10 sticky top-0">
            <h2 class="text-2xl font-bold text-gray-700">طلبات التسجيل والتجديد قيد المراجعة</h2>
        </header>

        <div class="p-8">
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-right text-sm">
                    <thead class="bg-gray-50 text-gray-500 border-b">
                        <tr>
                            <th class="px-6 py-4 font-bold">تاريخ الطلب</th>
                            <th class="px-6 py-4 font-bold">بيانات الطالب</th>
                            <th class="px-6 py-4 font-bold">الباقة / <span class="text-blue-600">نوع الطلب</span></th>
                            <th class="px-6 py-4 font-bold">الإيصال المالي</th>
                            <th class="px-6 py-4 font-bold text-center">القرار</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTable" class="divide-y divide-gray-100">
                        <tr><td colspan="5" class="px-6 py-8 text-center text-gray-500 font-bold">جاري جلب الطلبات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- نافذة الاعتماد وتعيين المعلم (للتسجيل الجديد فقط) -->
        <div id="approveModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-xl p-6 w-full max-w-md">
                <h3 class="text-xl font-bold mb-4 text-emerald-700">اعتماد طالب جديد وتعيين معلم</h3>
                <input type="hidden" id="pendingSubId">
                <label class="block font-bold mb-2">اختر المعلم المشرف:</label>
                <select id="teacherSelect" class="w-full border p-3 rounded-lg mb-6 font-bold"></select>
                <div class="flex space-x-2 space-x-reverse">
                    <button onclick="confirmApproveNew()" class="w-full bg-emerald-600 text-white p-3 rounded-lg font-bold hover:bg-emerald-700">اعتماد وتعيين</button>
                    <button onclick="document.getElementById('approveModal').classList.add('hidden')" class="w-full bg-gray-200 p-3 rounded-lg font-bold">إلغاء</button>
                </div>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        async function loadPendingRequests() {
            const tbody = document.getElementById('requestsTable');
            
            // جلب الاشتراكات المعلقة عبر استعلام مباشر لجلب المعرفات بشكل دقيق
            const { data: subs, error } = await window.supabase.from('subscriptions')
                .select(`id, created_at, receipt_url, student_id, packages(name, price), users!subscriptions_student_id_fkey(full_name, email, phone)`)
                .eq('status', 'pending')
                .order('created_at', { ascending: false });
                
            // جلب ملفات الطلاب للتحقق من وجود معلم (للتمييز بين التجديد والجديد)
            const { data: profiles } = await window.supabase.from('student_profiles').select('user_id, teacher_id');

            tbody.innerHTML = '';

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">خطأ: ${error.message}</td></tr>`;
                return;
            }

            if (subs && subs.length > 0) {
                subs.forEach(req => {
                    const date = new Date(req.created_at).toLocaleDateString('ar-OM', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    
                    const phone = req.users?.phone || 'غير متوفر';
                    const cleanPhone = phone !== 'غير متوفر' ? phone.replace(/\D/g, '') : '';
                    const waHtml = cleanPhone ? `<a href="https://wa.me/${cleanPhone}" target="_blank" class="text-green-600 hover:text-green-800 font-bold"><i class="fab fa-whatsapp ml-1"></i> ${phone}</a>` : `<span class="text-gray-400">${phone}</span>`;

                    const { data: urlData } = window.supabase.storage.from('payment-receipts').getPublicUrl(req.receipt_url);
                    
                    // تحديد نوع الطلب
                    const studentProfile = profiles?.find(p => p.user_id === req.student_id);
                    const isRenewal = studentProfile && studentProfile.teacher_id !== null;
                    
                    const typeBadge = isRenewal 
                        ? `<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold block mt-2 w-max border border-blue-200">تجديد اشتراك</span>`
                        : `<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-xs font-bold block mt-2 w-max border border-emerald-200">تسجيل جديد</span>`;

                    // زر الاعتماد يختلف حسب نوع الطلب
                    const approveBtn = isRenewal
                        ? `<button onclick="approveRenewal('${req.id}')" class="bg-blue-600 text-white hover:bg-blue-700 px-4 py-2 rounded-lg font-bold shadow-sm flex items-center w-full justify-center"><i class="fas fa-check-double ml-2"></i> اعتماد التجديد</button>`
                        : `<button onclick="openAssignModal('${req.id}')" class="bg-emerald-100 text-emerald-700 hover:bg-emerald-600 hover:text-white px-4 py-2 rounded-lg font-bold shadow-sm flex items-center w-full justify-center"><i class="fas fa-user-check ml-2"></i> اعتماد وتعيين</button>`;

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 border-b transition">
                            <td class="px-6 py-4 text-gray-500 text-xs">${date}</td>
                            <td class="px-6 py-4">
                                <div class="font-bold text-gray-800">${req.users?.full_name}</div>
                                <div class="text-xs text-gray-500 my-1">${req.users?.email}</div>
                                <div class="text-xs" dir="ltr" style="text-align: right;">${waHtml}</div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="font-bold text-gray-800">${req.packages?.name} (${req.packages?.price} ر.ع)</div>
                                ${typeBadge}
                            </td>
                            <td class="px-6 py-4">
                                <a href="${urlData.publicUrl}" target="_blank" class="text-emerald-600 hover:text-emerald-800 font-bold"><i class="fas fa-image ml-1"></i> عرض الإيصال</a>
                            </td>
                            <td class="px-6 py-4 flex flex-col space-y-2">
                                ${approveBtn}
                                <button onclick="rejectRequest('${req.id}')" class="bg-gray-100 text-red-600 hover:bg-red-100 px-4 py-2 rounded-lg font-bold transition w-full">رفض وإلغاء</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-12 text-center text-gray-400 font-bold text-lg">لا توجد طلبات معلقة.</td></tr>';
            }
        }

        let availableTeachers = [];
        window.addEventListener('load', async () => {
            const { data } = await window.supabase.from('users').select('id, full_name').eq('role', 'teacher');
            availableTeachers = data || [];
            loadPendingRequests();
        });

        // اعتماد تسجيل جديد
        function openAssignModal(subId) {
            document.getElementById('pendingSubId').value = subId;
            const select = document.getElementById('teacherSelect');
            select.innerHTML = '<option value="">-- اختر المعلم --</option>';
            availableTeachers.forEach(t => { select.innerHTML += `<option value="${t.id}">${t.full_name}</option>`; });
            document.getElementById('approveModal').classList.remove('hidden');
            document.getElementById('approveModal').classList.add('flex');
        }

        async function confirmApproveNew() {
            const subId = document.getElementById('pendingSubId').value;
            const tId = document.getElementById('teacherSelect').value;
            if(!tId) return alert('الرجاء اختيار معلم!');

            const { error } = await window.supabase.rpc('approve_student_with_teacher', { p_sub_id: subId, p_teacher_id: tId });
            if (error) alert('خطأ: ' + error.message);
            else { document.getElementById('approveModal').classList.add('hidden'); loadPendingRequests(); }
        }

        // اعتماد تجديد اشتراك (بدون تغيير المعلم)
        async function approveRenewal(subId) {
            if(!confirm('سيتم اعتماد تجديد الاشتراك وبقاء الطالب مع نفس معلمه الحالي. المتابعة؟')) return;
            const { error } = await window.supabase.rpc('update_subscription_status', { p_sub_id: subId, p_status: 'approved' });
            if (error) alert('خطأ: ' + error.message);
            else loadPendingRequests();
        }

        // رفض
        async function rejectRequest(subId) {
            if(!confirm('تأكيد رفض الطلب؟')) return;
            await window.supabase.rpc('update_subscription_status', { p_sub_id: subId, p_status: 'rejected' });
            loadPendingRequests();
        }
    </script>
</body>
</html>
