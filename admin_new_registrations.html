<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مدير النظام - طلبات التسجيل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; background-color: #f4f7f6; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">
    <!-- انسخ نفس القائمة الجانبية هنا -->
    
    <main class="flex-1 flex flex-col overflow-y-auto bg-gray-50">
        <header class="bg-white shadow-sm p-4 border-b">
            <h2 class="text-2xl font-bold text-gray-700">طلبات التسجيل بانتظار المقابلة</h2>
        </header>

        <div class="p-8">
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-right text-sm">
                    <thead class="bg-gray-50 text-gray-500 border-b">
                        <tr>
                            <th class="px-6 py-4">اسم الطالب</th>
                            <th class="px-6 py-4">تاريخ التسجيل</th>
                            <th class="px-6 py-4">إسناد لمعلم (للمقابلة المبدئية)</th>
                        </tr>
                    </thead>
                    <tbody id="pendingTable" class="divide-y divide-gray-100">
                        <tr><td colspan="3" class="px-6 py-4 text-center">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        async function loadPending() {
            // جلب المعلمين للقائمة المنسدلة
            const { data: teachers } = await window.supabase.from('users').select('id, full_name').eq('role', 'teacher');
            let teacherOptions = '<option value="">-- اختر المعلم --</option>';
            if(teachers) teachers.forEach(t => teacherOptions += `<option value="${t.id}">${t.full_name}</option>`);

            // جلب الطلاب الذين حالتهم pending_interview
            const { data: profiles } = await window.supabase.from('student_profiles').select('user_id, users(full_name, created_at)').eq('status', 'pending_interview');
            
            const tbody = document.getElementById('pendingTable');
            tbody.innerHTML = '';
            
            if(profiles && profiles.length > 0) {
                profiles.forEach(prof => {
                    const date = new Date(prof.users.created_at).toLocaleDateString('ar-OM');
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 font-bold">${prof.users.full_name}</td>
                            <td class="px-6 py-4 text-gray-500">${date}</td>
                            <td class="px-6 py-4 flex items-center space-x-2 space-x-reverse">
                                <select class="border rounded p-2 text-sm w-48">${teacherOptions}</select>
                                <button class="bg-emerald-600 text-white px-3 py-2 rounded text-sm hover:bg-emerald-700">اعتماد الإسناد</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-8 text-center text-gray-400">لا توجد طلبات جديدة.</td></tr>';
            }
        }
        window.addEventListener('load', loadPending);
    </script>
</body>
</html>
