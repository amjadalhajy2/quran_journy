<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الحصص - بوابة الطالب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap'); body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">


    <main class="flex-1 flex flex-col overflow-y-auto bg-gray-50">
<header class="bg-white shadow-sm p-4 flex justify-between items-center border-b z-20 sticky top-0 relative">
            <div class="flex items-center gap-3">
                <!-- زر القائمة لجميع الأجهزة -->
                <button onclick="document.getElementById('studentMenu').classList.toggle('hidden')" class="text-gray-600 hover:text-emerald-600 focus:outline-none text-2xl transition">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 class="text-xl md:text-2xl font-bold text-gray-700">مرحباً بك، <span id="welcomeName" class="text-emerald-600">...</span></h2>
            </div>
            
            <button onclick="logout()" class="text-red-500 hover:bg-red-50 px-3 py-2 rounded-lg font-bold transition flex items-center text-sm md:text-base"><i class="fas fa-sign-out-alt ml-2"></i> خروج</button>
            
            <!-- القائمة المنسدلة للطالب -->
            <nav id="studentMenu" class="hidden absolute top-full right-0 w-full md:w-72 bg-[#1e293b] text-white shadow-xl flex flex-col z-50 border-t border-gray-700">
                <a href="student_dashboard.html" class="px-6 py-4 border-b border-gray-700 hover:bg-gray-800 transition"><i class="fas fa-home ml-3 text-emerald-400"></i> الرئيسية</a>
                <a href="student_history.html" class="px-6 py-4 border-b border-gray-700 hover:bg-gray-800 transition"><i class="fas fa-history ml-3 text-emerald-400"></i> سجل الحصص</a>
                <a href="student_renew.html" class="px-6 py-4 hover:bg-gray-800 text-blue-400 transition"><i class="fas fa-sync-alt ml-3"></i> تجديد الاشتراك</a>
            </nav>
        </header>

        <div class="p-8">
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-right text-sm">
                    <thead class="bg-gray-50 text-gray-600 border-b">
                        <tr>
                            <th class="px-6 py-4 font-bold">التاريخ والوقت</th>
                            <th class="px-6 py-4 font-bold">المعلم</th>
                            <th class="px-6 py-4 font-bold">ملاحظات المعلم وتوصياته</th>
                            <th class="px-6 py-4 font-bold text-center">التقييم</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable" class="divide-y divide-gray-100">
                        <tr><td colspan="4" class="px-6 py-8 text-center text-gray-500 font-bold">جاري تحميل السجل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>

function formatTime12(timeStr) {
    if (!timeStr) return '';
    let [hours, minutes] = timeStr.substring(0, 5).split(':');
    hours = parseInt(hours, 10);
    let ampm = hours >= 12 ? 'م' : 'ص';
    hours = hours % 12;
    hours = hours ? hours : 12; // تحويل الصفر (منتصف الليل) إلى 12
    return hours + ':' + minutes + ' ' + ampm;
}
        
        window.addEventListener('load', async () => {
            const { data: { user } } = await window.supabase.auth.getUser();
            if (!user) return window.location.href = 'login.html';

            const { data: sessions, error } = await window.supabase.from('sessions')
                .select(`session_date, start_time, teacher_notes, evaluation, users!sessions_teacher_id_fkey(full_name)`)
                .eq('student_id', user.id)
                .eq('status', 'completed')
                .order('session_date', { ascending: false });

            const tbody = document.getElementById('historyTable');
            tbody.innerHTML = '';

            if (sessions && sessions.length > 0) {
                sessions.forEach(sess => {
                    const gradeHtml = sess.evaluation 
                        ? `<span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold text-sm border border-emerald-200">${sess.evaluation} / 10</span>` 
                        : '<span class="text-gray-400">-</span>';
                        
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="px-6 py-4">
                                <div class="font-bold text-gray-800">${sess.session_date}</div>
                                <div class="text-xs text-gray-500 mt-1" dir="ltr" style="text-align: right;">${formatTime12(sess.start_time)} <i class="far fa-clock"></i></div>
                            </td>
                            <td class="px-6 py-4 font-bold text-gray-700">${sess.users?.full_name}</td>
                            <td class="px-6 py-4 text-gray-600 leading-relaxed text-xs">${sess.teacher_notes || 'لا توجد ملاحظات مسجلة.'}</td>
                            <td class="px-6 py-4 text-center">${gradeHtml}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-12 text-center text-gray-400 font-bold"><i class="fas fa-folder-open text-3xl mb-3 block"></i> لم تقم بإنجاز أي حصة حتى الآن.</td></tr>';
            }
        });
    </script>
</body>
</html>
