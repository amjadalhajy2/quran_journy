<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفاصيل المعلم والجدول الزمني</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap'); body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex flex-col h-screen overflow-hidden text-gray-800">
    <header class="bg-white shadow p-4 flex justify-between items-center z-10 relative">
        <div class="flex items-center">
            <a href="admin_teachers.html" class="text-gray-500 hover:text-emerald-600 bg-gray-100 p-2 rounded-lg ml-4 transition font-bold"><i class="fas fa-arrow-right"></i> رجوع للمعلمين</a>
            <h2 class="text-xl font-bold text-gray-700">ملف المعلم: <span id="teacherNameHeader" class="text-emerald-600">جاري التحميل...</span></h2>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 space-y-6">
        <div class="bg-white rounded-xl shadow-sm border p-6">
            <h3 class="font-bold text-lg mb-4 text-emerald-700 border-b pb-2"><i class="fas fa-users ml-2"></i> الطلاب الموكلين للمعلم</h3>
            <div id="studentsList" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <p class="text-gray-500 text-sm font-bold">جاري تحميل الطلاب...</p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-6">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 class="font-bold text-lg text-emerald-700"><i class="fas fa-calendar-week ml-2"></i> الجدول الأسبوعي للحلقات</h3>
                <div class="flex items-center bg-gray-100 rounded-lg p-1 space-x-1 space-x-reverse">
                    <button onclick="changeWeek(1)" class="px-4 py-1.5 hover:bg-white rounded text-gray-600 font-bold shadow-sm transition">التالي <i class="fas fa-chevron-left mr-1 text-xs"></i></button>
                    
                    <span id="weekDisplay" class="px-4 font-bold text-emerald-700 text-sm border-x border-gray-300">الأسبوع الحالي</span>
                    <button onclick="resetToToday()" class="px-3 py-1.5 hover:bg-white rounded text-emerald-600 font-bold shadow-sm transition border border-emerald-200 bg-emerald-50">اليوم</button>
                    
                    <button onclick="changeWeek(-1)" class="px-4 py-1.5 hover:bg-white rounded text-gray-600 font-bold shadow-sm transition"><i class="fas fa-chevron-right ml-1 text-xs"></i> السابق</button>
                </div>
            </div>

            <div class="grid grid-cols-7 gap-3 min-w-[800px] overflow-x-auto" id="calendarGrid"></div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const teacherId = urlParams.get('id');
        let currentWeekOffset = 0; 

        if(!teacherId) window.location.href = 'admin_teachers.html';

        function getLocalDateString(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        async function initPage() {
            const { data: teacher } = await window.supabase.from('users').select('full_name').eq('id', teacherId).single();
            if(teacher) document.getElementById('teacherNameHeader').textContent = teacher.full_name;

            const { data: students } = await window.supabase.from('student_profiles')
                .select(`user_id, users!student_profiles_user_id_fkey(full_name), curriculums(name)`)
                .eq('teacher_id', teacherId);
            
            let subs = [];
            if (students && students.length > 0) {
                const studentIds = students.map(s => s.user_id);
                const { data: subscriptions } = await window.supabase.from('subscriptions')
                    .select('student_id, packages(sessions_per_week)')
                    .eq('status', 'approved')
                    .in('student_id', studentIds);
                subs = subscriptions || [];
            }

            const sList = document.getElementById('studentsList');
            sList.innerHTML = '';
            
            if(students && students.length > 0) {
                students.forEach(s => {
                    const cName = s.curriculums ? s.curriculums.name : 'بانتظار تحديد المقرر';
                    const studentSub = subs.find(sub => sub.student_id === s.user_id);
                    const sessionsCount = studentSub?.packages?.sessions_per_week || 0;
                    
                    const sessionsBadge = sessionsCount > 0 
                        ? `<span class="bg-emerald-100 text-emerald-800 px-2 py-1 rounded text-[10px] font-bold shadow-sm">${sessionsCount} حصص / أسبوعياً</span>` 
                        : `<span class="bg-red-50 text-red-600 px-2 py-1 rounded text-[10px] font-bold border border-red-100">بدون باقة نشطة</span>`;

                    sList.innerHTML += `
                        <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl shadow-sm flex flex-col transition hover:shadow-md">
                            <h4 class="font-bold text-gray-800 mb-3 text-sm">${s.users.full_name}</h4>
                            <div class="flex items-center justify-between mt-auto border-t border-blue-200/50 pt-2">
                                <p class="text-xs font-bold text-blue-600 truncate max-w-[50%]">${cName}</p>
                                ${sessionsBadge}
                            </div>
                        </div>`;
                });
            } else {
                sList.innerHTML = '<p class="text-gray-400 font-bold col-span-3 text-center py-6">لا يوجد طلاب موكلين لهذا المعلم بعد.</p>';
            }

            loadCalendar();
        }

        async function loadCalendar() {
            const today = new Date();
            const currentDay = today.getDay(); 
            
            const actualToday = new Date();
            actualToday.setHours(0,0,0,0);

            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - currentDay + (currentWeekOffset * 7));
            startOfWeek.setHours(0,0,0,0);
            
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23,59,59,999);

            const startStr = getLocalDateString(startOfWeek);
            const endStr = getLocalDateString(endOfWeek);

            document.getElementById('weekDisplay').textContent = `${startOfWeek.toLocaleDateString('ar-OM', {month:'short', day:'numeric'})} - ${endOfWeek.toLocaleDateString('ar-OM', {month:'short', day:'numeric'})}`;

            const { data: sessions } = await window.supabase.from('sessions')
                .select('id, session_date, start_time, end_time, status, users!sessions_student_id_fkey(full_name)')
                .eq('teacher_id', teacherId)
                .gte('session_date', startStr)
                .lte('session_date', endStr);

            const now = new Date();
            const currentDateString = getLocalDateString(now);
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            if (sessions) {
                for (let sess of sessions) {
                    if (sess.status === 'scheduled' || sess.status === 'ongoing') {
                        let isPast = false;
                        if (sess.session_date < currentDateString) {
                            isPast = true;
                        } else if (sess.session_date === currentDateString) {
                            const [endH, endM] = sess.end_time.substring(0,5).split(':').map(Number);
                            if ((endH * 60 + endM) < currentMinutes) {
                                isPast = true;
                            }
                        }
                        if (isPast) {
                            await window.supabase.from('sessions').update({ status: 'completed' }).eq('id', sess.id);
                            sess.status = 'completed'; 
                        }
                    }
                }
            }

            const daysNames = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const actualTodayString = getLocalDateString(new Date());

            for(let i=0; i<7; i++) {
                const dayDate = new Date(startOfWeek);
                dayDate.setDate(startOfWeek.getDate() + i);
                dayDate.setHours(0,0,0,0);
                
                const dateString = getLocalDateString(dayDate);
                const daySessions = (sessions || []).filter(s => s.session_date === dateString);
                
                let headerClass = 'bg-gray-200 text-gray-700';
                let bodyClass = 'border border-gray-200 bg-gray-50';
                
                if (dayDate.getTime() === actualToday.getTime()) {
                    headerClass = 'bg-emerald-500 text-white shadow-md border-b-4 border-emerald-700';
                    bodyClass = 'border-2 border-emerald-500 bg-emerald-50 shadow-md'; 
                } else if (dayDate.getTime() < actualToday.getTime()) {
                    headerClass = 'bg-gray-100 text-gray-400';
                    bodyClass = 'border border-gray-200 bg-gray-100 opacity-60'; 
                } else {
                    headerClass = 'bg-blue-50 text-blue-800 border-b-2 border-blue-200';
                    bodyClass = 'border border-gray-200 bg-white';
                }

                let colHtml = `<div class="rounded-xl overflow-hidden min-h-[350px] flex flex-col ${bodyClass} transition-all">
                                <div class="text-center py-2 ${headerClass}">
                                    <h4 class="font-bold">${daysNames[i]}</h4>
                                    <span class="text-xs font-medium opacity-90">${dayDate.toLocaleDateString('ar-OM', {month:'numeric', day:'numeric'})}</span>
                                </div>
                                <div class="p-2 space-y-2 flex-1">`;
                
                if(daySessions.length > 0) {
                    daySessions.sort((a,b) => a.start_time.localeCompare(b.start_time)).forEach(sess => {
                        const sTime = sess.start_time.substring(0,5); 
                        const eTime = sess.end_time.substring(0,5);
                        
                        let statusBadge = '';
                        let cardStyle = '';
                        
                        switch(sess.status) {
                            case 'scheduled': 
                                statusBadge = '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold">مجدولة</span>'; 
                                cardStyle = 'bg-white border-blue-200 shadow-sm';
                                break;
                            case 'ongoing': 
                                statusBadge = '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded text-[10px] font-bold animate-pulse">جارية الآن</span>'; 
                                cardStyle = 'bg-red-50 border-red-300 shadow-md ring-1 ring-red-200';
                                break;
                            case 'completed': 
                                statusBadge = '<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-[10px] font-bold">انتهت</span>'; 
                                cardStyle = 'bg-gray-50 border-green-200 opacity-80';
                                break;
                            case 'cancelled': 
                                statusBadge = '<span class="bg-gray-200 text-gray-500 px-2 py-0.5 rounded text-[10px] font-bold line-through">ملغية</span>'; 
                                cardStyle = 'bg-gray-100 border-gray-200 opacity-60 grayscale';
                                break;
                            default:
                                statusBadge = `<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-[10px] font-bold">${sess.status}</span>`; 
                                cardStyle = 'bg-emerald-50 border-emerald-200';
                        }

                        // تحويل البطاقة إلى رابط لغرفة الإشراف
                        if (sess.status === 'cancelled') {
                            colHtml += `<div class="block ${cardStyle} border p-2 rounded-lg text-sm relative flex flex-col">
                                <div class="font-bold text-gray-800 text-xs mb-1.5 text-center">${sess.users.full_name}</div>
                                <div class="border-t border-gray-200/60 pt-1.5 pb-1.5 text-center w-full whitespace-nowrap">
                                    <span class="font-bold text-gray-500 text-[11px] inline-block"><i class="far fa-clock ml-1"></i>${sTime} - ${eTime}</span>
                                </div>
                                <div class="border-t border-gray-200/60 pt-1.5 mt-auto text-center w-full">
                                    ${statusBadge}
                                </div>
                            </div>`;
                        } else {
                            colHtml += `<a href="admin_virtual_session.html?session_id=${sess.id}" class="block ${cardStyle} border p-2 rounded-lg text-sm relative transition hover:shadow-md flex flex-col cursor-pointer" title="انقر للدخول للحصة ووضع ملاحظات إشرافية">
                                <div class="font-bold text-gray-800 text-xs mb-1.5 text-center">${sess.users.full_name}</div>
                                <div class="border-t border-gray-200/60 pt-1.5 pb-1.5 text-center w-full whitespace-nowrap">
                                    <span class="font-bold text-gray-500 text-[11px] inline-block"><i class="far fa-clock ml-1"></i>${sTime} - ${eTime}</span>
                                </div>
                                <div class="border-t border-gray-200/60 pt-1.5 mt-auto text-center w-full">
                                    ${statusBadge}
                                </div>
                            </a>`;
                        }
                    });
                } else {
                    colHtml += `<div class="text-center text-gray-400 font-bold text-xs mt-6 flex flex-col items-center">
                        <i class="far fa-calendar-times text-2xl mb-2 opacity-50"></i>
                        لا توجد حلقات
                    </div>`;
                }

                colHtml += `</div></div>`;
                grid.innerHTML += colHtml;
            }
        }

        function changeWeek(direction) {
            currentWeekOffset += direction;
            loadCalendar();
        }

        function resetToToday() {
            currentWeekOffset = 0;
            loadCalendar();
        }

        window.addEventListener('load', initPage);
    </script>
</body>
</html>
