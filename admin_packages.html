<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مدير النظام - إدارة الباقات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; background-color: #f4f7f6; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">
    <!-- انسخ نفس القائمة الجانبية هنا -->
    
    <main class="flex-1 flex flex-col overflow-y-auto bg-gray-50">
        <header class="bg-white shadow-sm p-4 border-b">
            <h2 class="text-2xl font-bold text-gray-700">إدارة الباقات</h2>
        </header>

        <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- نموذج إضافة باقة -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit">
                    <h3 class="font-bold text-lg mb-4 text-emerald-600 border-b pb-2">إضافة باقة جديدة</h3>
                    <form id="addPackageForm" class="space-y-4">
                        <div><label class="block text-sm font-bold mb-1">اسم الباقة</label><input type="text" id="pName" class="w-full border rounded p-2" required></div>
                        <div><label class="block text-sm font-bold mb-1">السعر (ريال)</label><input type="number" id="pPrice" class="w-full border rounded p-2" required></div>
                        <div><label class="block text-sm font-bold mb-1">المميزات (افصل بينها بسطر)</label><textarea id="pFeatures" rows="3" class="w-full border rounded p-2" required></textarea></div>
                        <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2 rounded hover:bg-emerald-700">حفظ الباقة</button>
                    </form>
                </div>
                
                <!-- قائمة الباقات الحالية -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 overflow-y-auto" style="max-height: 500px;">
                    <h3 class="font-bold text-lg mb-4 text-gray-700 border-b pb-2">الباقات الحالية</h3>
                    <div id="packagesList" class="space-y-4">
                        <div class="text-center text-gray-400 py-4">جاري التحميل...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        async function loadPackages() {
            const { data } = await window.supabase.from('packages').select('*').order('price', { ascending: true });
            const list = document.getElementById('packagesList');
            list.innerHTML = '';
            if(data) {
                data.forEach(pkg => {
                    const statusColor = pkg.is_active ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700';
                    const statusText = pkg.is_active ? 'نشطة' : 'مخفية';
                    list.innerHTML += `
                        <div class="border rounded-lg p-4 flex justify-between items-center">
                            <div>
                                <h4 class="font-bold">${pkg.name} <span class="text-sm font-normal text-gray-500">(${pkg.price} ريال)</span></h4>
                                <span class="text-xs font-bold px-2 py-1 rounded ${statusColor} mt-2 inline-block">${statusText}</span>
                            </div>
                            <button class="text-gray-500 hover:text-red-500"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                });
            }
        }
        window.addEventListener('load', loadPackages);
    </script>
</body>
</html>
