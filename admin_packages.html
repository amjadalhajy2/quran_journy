<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة الباقات - منصة التحفيظ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap'); body { font-family: 'Tajawal', sans-serif; background-color: #f4f7f6; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">
    <aside class="w-64 bg-[#1a2b3c] text-white flex flex-col hidden md:flex z-20">
        <div class="p-6 text-xl font-bold border-b border-gray-700"><i class="fas fa-shield-alt text-emerald-400 mr-2 ml-2"></i> الإدارة العليا</div>
        <nav class="flex-1 p-4 space-y-2 text-sm font-medium">
            <a href="admin_dashboard.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800"><i class="fas fa-chart-pie ml-3"></i> لوحة المؤشرات</a>
            <a href="admin_teachers.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800"><i class="fas fa-chalkboard-teacher ml-3"></i> إدارة المعلمين</a>
            <a href="admin_new_registrations.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800"><i class="fas fa-user-plus ml-3"></i> طلبات التسجيل</a>
            <a href="admin_students.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800"><i class="fas fa-user-graduate ml-3"></i> الطلاب المنتظمين</a>
            <a href="admin_finances.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800"><i class="fas fa-file-invoice-dollar ml-3"></i> الإدارة المالية</a>
            <a href="admin_packages.html" class="flex items-center bg-emerald-600 px-4 py-3 rounded-lg"><i class="fas fa-box ml-3"></i> إدارة الباقات</a>
            <a href="admin_curriculum.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800"><i class="fas fa-book-open ml-3"></i> إدارة المقررات</a>
        </nav>
    </aside>
    <main class="flex-1 p-8 overflow-y-auto">
        <div class="bg-white p-6 rounded-xl shadow-sm border mb-8 max-w-2xl">
            <h3 class="font-bold text-lg mb-4 text-emerald-600 border-b pb-2">إضافة باقة جديدة</h3>
            <form id="pkgForm" class="grid grid-cols-2 gap-4">
                <div><label class="block font-bold mb-1 text-sm">اسم الباقة</label><input type="text" id="pName" class="w-full border rounded p-2" required></div>
                <div><label class="block font-bold mb-1 text-sm">السعر (ريال)</label><input type="number" id="pPrice" class="w-full border rounded p-2" required></div>
                <div class="col-span-2"><label class="block font-bold mb-1 text-sm">المميزات</label><input type="text" id="pFeat" class="w-full border rounded p-2" placeholder="مثال: 3 حصص أسبوعياً - متابعة يومية"></div>
                <button type="submit" class="col-span-2 bg-emerald-600 text-white font-bold p-3 rounded mt-2">إضافة الباقة</button>
            </form>
        </div>
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <table class="w-full text-right text-sm">
                <thead class="bg-gray-50 border-b"><tr><th class="px-6 py-4">اسم الباقة</th><th class="px-6 py-4">السعر</th><th class="px-6 py-4">الحالة</th><th class="px-6 py-4">إجراء</th></tr></thead>
                <tbody id="pkgTable"></tbody>
            </table>
        </div>
    </main>
    <script src="supabase.js"></script>
    <script>
        async function loadPkgs() {
            const { data } = await window.supabase.from('packages').select('*').order('created_at', {ascending:false});
            const tbody = document.getElementById('pkgTable'); tbody.innerHTML = '';
            if(data) data.forEach(p => {
                const status = p.is_active ? '<span class="text-green-600 font-bold">نشطة</span>' : '<span class="text-red-600 font-bold">موقوفة</span>';
                const btn = p.is_active ? `<button onclick="togglePkg('${p.id}', false)" class="text-red-600 hover:underline">إيقاف</button>` : `<button onclick="togglePkg('${p.id}', true)" class="text-green-600 hover:underline">تفعيل</button>`;
                tbody.innerHTML += `<tr><td class="px-6 py-4 font-bold">${p.name}</td><td class="px-6 py-4">${p.price} ريال</td><td class="px-6 py-4">${status}</td><td class="px-6 py-4">${btn}</td></tr>`;
            });
        }
        document.getElementById('pkgForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            await window.supabase.from('packages').insert([{name: document.getElementById('pName').value, price: document.getElementById('pPrice').value, features: document.getElementById('pFeat').value, is_active: true}]);
            document.getElementById('pkgForm').reset(); loadPkgs();
        });
        async function togglePkg(id, status) {
            await window.supabase.rpc('toggle_package', { p_package_id: id, p_status: status });
            loadPkgs();
        }
        window.addEventListener('load', loadPkgs);
    </script>
</body>
</html>
