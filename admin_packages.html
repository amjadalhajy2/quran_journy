<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة الباقات - منصة التحفيظ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap'); body { font-family: 'Tajawal', sans-serif; background-color: #f4f7f6; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800 relative">
    <aside class="w-64 bg-[#1a2b3c] text-white flex flex-col hidden md:flex shadow-2xl z-20">
        <div class="p-6 text-xl font-bold border-b border-gray-700"><i class="fas fa-shield-alt text-emerald-400 mr-2 ml-2"></i> الإدارة العليا</div>
        <nav class="flex-1 p-4 space-y-2 text-sm font-medium">
            <a href="admin_dashboard.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-chart-pie ml-3"></i> لوحة المؤشرات</a>
            <a href="admin_teachers.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-chalkboard-teacher ml-3"></i> إدارة المعلمين</a>
            <a href="admin_new_registrations.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-user-plus ml-3"></i> طلبات التسجيل</a>
            <a href="admin_students.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-user-graduate ml-3"></i> الطلاب المنتظمين</a>
            <a href="admin_finances.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-file-invoice-dollar ml-3"></i> الإدارة المالية</a>
            <a href="admin_packages.html" class="flex items-center bg-emerald-600 px-4 py-3 rounded-lg text-white shadow"><i class="fas fa-box ml-3"></i> إدارة الباقات</a>
            <a href="admin_curriculum.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-book-open ml-3"></i> إدارة المقررات</a>
        </nav>
    </aside>
    
    <main class="flex-1 overflow-y-auto bg-gray-50">
        <header class="bg-white shadow-sm p-4 border-b flex justify-between items-center z-10 sticky top-0">
            <h2 class="text-2xl font-bold text-gray-700">هيكلة باقات الاشتراك</h2>
        </header>

        <div class="p-8 space-y-8">
            <!-- نموذج إضافة الباقة (منظم ومحسّن) -->
            <div class="bg-white p-6 rounded-xl shadow-sm border">
                <h3 class="font-bold text-lg mb-6 text-emerald-700 border-b pb-2"><i class="fas fa-plus-circle ml-2"></i> إضافة باقة جديدة</h3>
                <form id="pkgForm" class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="md:col-span-1">
                        <label class="block font-bold mb-2 text-sm text-gray-700">اسم الباقة</label>
                        <input type="text" id="pName" class="w-full border border-gray-300 focus:border-emerald-500 rounded-lg p-3 outline-none" placeholder="مثال: الباقة الذهبية" required>
                    </div>
                    <div class="md:col-span-1">
                        <label class="block font-bold mb-2 text-sm text-gray-700">السعر (ريال)</label>
                        <input type="number" id="pPrice" class="w-full border border-gray-300 focus:border-emerald-500 rounded-lg p-3 outline-none" required>
                    </div>
                    <div class="md:col-span-1">
                        <label class="block font-bold mb-2 text-sm text-gray-700">عدد الحصص (أسبوعياً)</label>
                        <input type="number" id="pSessions" class="w-full border border-gray-300 focus:border-emerald-500 rounded-lg p-3 outline-none" value="3" required>
                    </div>
                    <div class="md:col-span-1">
                        <label class="block font-bold mb-2 text-sm text-gray-700">مدة الحصة (بالدقائق)</label>
                        <input type="number" id="pDuration" class="w-full border border-gray-300 focus:border-emerald-500 rounded-lg p-3 outline-none" value="30" required>
                    </div>
                    <div class="md:col-span-4">
                        <label class="block font-bold mb-2 text-sm text-gray-700">المميزات (وصف مختصر يظهر للطالب)</label>
                        <textarea id="pFeat" rows="2" class="w-full border border-gray-300 focus:border-emerald-500 rounded-lg p-3 outline-none" placeholder="مثال: متابعة يومية، تقارير أسبوعية، حصص تفاعلية..."></textarea>
                    </div>
                    <div class="md:col-span-4 flex justify-end">
                        <button type="submit" id="addBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition">
                            حفظ الباقة الجديدة
                        </button>
                    </div>
                </form>
            </div>

            <!-- جدول عرض الباقات الشامل -->
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-right text-sm">
                    <thead class="bg-gray-50 text-gray-600 border-b">
                        <tr>
                            <th class="px-6 py-4 font-bold">اسم الباقة</th>
                            <th class="px-6 py-4 font-bold">السعر</th>
                            <th class="px-6 py-4 font-bold">عدد الحصص</th>
                            <th class="px-6 py-4 font-bold">المدة</th>
                            <th class="px-6 py-4 font-bold w-1/3">المميزات</th>
                            <th class="px-6 py-4 font-bold">الحالة</th>
                            <th class="px-6 py-4 font-bold">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="pkgTable" class="divide-y divide-gray-100">
                        <tr><td colspan="7" class="px-6 py-8 text-center text-gray-500 font-bold">جاري تحميل الباقات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        // دالة جلب الباقات وعرضها بالجدول
        async function loadPkgs() {
            const { data } = await window.supabase.from('packages').select('*').order('created_at', {ascending:false});
            const tbody = document.getElementById('pkgTable'); 
            tbody.innerHTML = '';
            
            if(data && data.length > 0) {
                data.forEach(p => {
                    const status = p.is_active ? '<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold text-xs">نشطة</span>' : '<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full font-bold text-xs">موقوفة</span>';
                    const btn = p.is_active 
                        ? `<button onclick="togglePkg('${p.id}', false)" class="text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1 rounded font-bold transition">إيقاف</button>` 
                        : `<button onclick="togglePkg('${p.id}', true)" class="text-emerald-600 bg-emerald-50 hover:bg-emerald-100 px-3 py-1 rounded font-bold transition">تفعيل</button>`;
                    
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="px-6 py-4 font-bold text-emerald-800">${p.name}</td>
                            <td class="px-6 py-4 font-bold text-gray-700">${p.price} ريال</td>
                            <td class="px-6 py-4 text-blue-600 font-bold bg-blue-50 text-center rounded">${p.sessions_per_week} أسبوعياً</td>
                            <td class="px-6 py-4 font-bold text-gray-600">${p.session_duration} دقيقة</td>
                            <td class="px-6 py-4 text-gray-500 text-xs leading-relaxed">${p.features || 'لا توجد مميزات'}</td>
                            <td class="px-6 py-4">${status}</td>
                            <td class="px-6 py-4">${btn}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-8 text-center text-gray-400 font-bold">لا توجد باقات حالياً.</td></tr>';
            }
        }

        // حفظ باقة جديدة
        document.getElementById('pkgForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            const btn = document.getElementById('addBtn');
            btn.disabled = true; btn.textContent = 'جاري الحفظ...';

            await window.supabase.from('packages').insert([{
                name: document.getElementById('pName').value, 
                price: document.getElementById('pPrice').value, 
                sessions_per_week: document.getElementById('pSessions').value,
                session_duration: document.getElementById('pDuration').value,
                features: document.getElementById('pFeat').value, 
                is_active: true
            }]);
            
            document.getElementById('pkgForm').reset(); 
            btn.disabled = false; btn.textContent = 'حفظ الباقة الجديدة';
            loadPkgs();
        });

        // تغيير حالة الباقة (RPC)
        async function togglePkg(id, status) {
            await window.supabase.rpc('toggle_package', { p_package_id: id, p_status: status });
            loadPkgs();
        }

        window.addEventListener('load', loadPkgs);
    </script>
</body>
</html>
