<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>التقييم المبدئي والدوري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap'); body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">
    <aside class="w-64 bg-[#1e293b] text-white flex flex-col hidden md:flex z-20">
        <div class="p-6 text-xl font-bold border-b border-gray-700 text-emerald-400"><i class="fas fa-book-reader mr-2 ml-2"></i> بوابة المعلم</div>
        <nav class="flex-1 p-4 space-y-2 text-sm font-medium">
            <a href="teacher_dashboard.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-home ml-3"></i> الرئيسية</a>
            <a href="teacher_students_list.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-users ml-3"></i> قائمة طلابي</a>
            <a href="teacher_interviews.html" class="flex items-center bg-emerald-600 px-4 py-3 rounded-lg text-white shadow"><i class="fas fa-clipboard-list ml-3"></i> التقييم المبدئي والدوري</a>
            <a href="teacher_virtual_session.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-video ml-3"></i> غرفة الإقراء</a>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 bg-gray-50">
        <h2 class="text-2xl font-bold text-gray-700 mb-6">إجراء تقييم وتحديد مستوى</h2>
        
        <div class="bg-white p-8 rounded-xl shadow-sm border max-w-4xl">
            <form id="evaluationForm" class="space-y-8">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border-b pb-6">
                    <div>
                        <label class="block font-bold text-sm mb-2 text-gray-700">اختر الطالب (بانتظار التقييم)</label>
                        <select id="studentSelect" class="w-full border rounded-lg p-3 bg-gray-50 focus:border-emerald-500 font-bold" required>
                            <option value="">جاري تحميل الطلاب...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-sm mb-2 text-gray-700">مستوى الطالب (نتيجة التقييم)</label>
                        <select id="levelSelect" class="w-full border rounded-lg p-3 bg-white focus:border-emerald-500 font-bold" required>
                            <option value="مبتدئ">مبتدئ (تأسيس وتلقين)</option>
                            <option value="متوسط">متوسط (تلاوة وأحكام)</option>
                            <option value="متقدم">متقدم (حفظ وإتقان)</option>
                        </select>
                    </div>
                </div>

                <!-- بناء الخطة المخصصة الذكية -->
                <div class="border-b pb-6">
                    <h3 class="font-bold text-emerald-700 mb-4"><i class="fas fa-route ml-2"></i> بناء خطة الحفظ (تحديد المقرر)</h3>
                    <div class="flex space-x-6 space-x-reverse mb-4 bg-gray-100 p-3 rounded-lg inline-flex">
                        <label class="flex items-center font-bold cursor-pointer">
                            <input type="radio" name="planType" value="parts" checked class="w-4 h-4 text-emerald-600 focus:ring-emerald-500 ml-2" onchange="togglePlanInputs()"> 
                            تحديد بالأجزاء
                        </label>
                        <label class="flex items-center font-bold cursor-pointer border-r border-gray-300 pr-6">
                            <input type="radio" name="planType" value="surahs" class="w-4 h-4 text-emerald-600 focus:ring-emerald-500 ml-2" onchange="togglePlanInputs()"> 
                            تحديد بالسور
                        </label>
                    </div>

                    <!-- صندوق تحديد الأجزاء (شبكة اختيار) -->
                    <div id="partsInputGroup" class="bg-emerald-50 p-4 rounded-lg border border-emerald-200">
                        <label class="block font-bold text-sm mb-3 text-emerald-800"><i class="fas fa-check-square ml-1"></i> حدد الأجزاء المراد حفظها (يمكنك تحديد أكثر من جزء):</label>
                        <div id="juzContainer" class="h-48 overflow-y-auto border border-emerald-100 rounded-lg p-3 bg-white grid grid-cols-2 md:grid-cols-4 gap-3 shadow-inner">
                            <!-- سيتم توليد الـ 30 جزء هنا بالجافاسكربت -->
                        </div>
                    </div>

                    <!-- صندوق تحديد السور (شبكة اختيار) -->
                    <div id="surahsInputGroup" class="bg-emerald-50 p-4 rounded-lg border border-emerald-200 hidden">
                        <label class="block font-bold text-sm mb-3 text-emerald-800"><i class="fas fa-check-square ml-1"></i> حدد السور المراد حفظها (يمكنك تحديد أكثر من سورة):</label>
                        <div id="surahsContainer" class="h-56 overflow-y-auto border border-emerald-100 rounded-lg p-3 bg-white grid grid-cols-2 md:grid-cols-4 gap-3 shadow-inner">
                            <!-- سيتم توليد الـ 114 سورة هنا بالجافاسكربت -->
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border-b pb-6">
                    <div>
                        <label class="block font-bold text-sm mb-2 text-gray-700">جودة التلاوة المبدئية (من 10)</label>
                        <input type="range" min="1" max="10" value="5" class="w-full accent-emerald-600" oninput="document.getElementById('tajweedScore').innerText = this.value">
                        <div class="text-center font-black text-2xl text-emerald-600 mt-2" id="tajweedScore">5</div>
                    </div>
                    <div>
                        <label class="block font-bold text-sm mb-2 text-gray-700">ملاحظات المعلم وتوصياته للطالب</label>
                        <textarea id="evalNotes" rows="3" class="w-full border rounded-lg p-3 focus:border-emerald-500" placeholder="مثال: يحتاج للتركيز على مخارج الحروف..." required></textarea>
                    </div>
                </div>
                
                <div id="evalMsg" class="hidden text-center p-3 rounded font-bold mt-4"></div>

                <div class="flex justify-end pt-4">
                    <button type="submit" id="saveEvalBtn" class="bg-emerald-600 text-white px-8 py-3 rounded-lg font-bold shadow hover:bg-emerald-700 transition">
                        <i class="fas fa-save ml-2"></i> اعتماد التقييم والخطة
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        let currentUserId = null;

        // توليد قائمة الأجزاء (30 جزء)
        const juzContainer = document.getElementById('juzContainer');
        for(let i=1; i<=30; i++) {
            juzContainer.innerHTML += `
                <label class="flex items-center space-x-2 space-x-reverse cursor-pointer hover:bg-emerald-50 p-2 rounded transition border border-transparent hover:border-emerald-200">
                    <input type="checkbox" name="juz_check" value="الجزء ${i}" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
                    <span class="text-sm font-bold text-gray-700">الجزء ${i}</span>
                </label>
            `;
        }

        // توليد قائمة سور القرآن (114 سورة)
        const surahsList = [
            'الفاتحة', 'البقرة', 'آل عمران', 'النساء', 'المائدة', 'الأنعام', 'الأعراف', 'الأنفال', 'التوبة', 'يونس', 'هود', 'يوسف', 'الرعد', 'إبراهيم', 'الحجر', 'النحل', 'الإسراء', 'الكهف', 'مريم', 'طه', 'الأنبياء', 'الحج', 'المؤمنون', 'النور', 'الفرقان', 'الشعراء', 'النمل', 'القصص', 'العنكبوت', 'الروم', 'لقمان', 'السجدة', 'الأحزاب', 'سبأ', 'فاطر', 'يس', 'الصافات', 'ص', 'الزمر', 'غافر', 'فصلت', 'الشورى', 'الزخرف', 'الدخان', 'الجاثية', 'الأحقاف', 'محمد', 'الفتح', 'الحجرات', 'ق', 'الذاريات', 'الطور', 'النجم', 'القمر', 'الرحمن', 'الواقعة', 'الحديد', 'المجادلة', 'الحشر', 'الممتحنة', 'الصف', 'الجمعة', 'المنافقون', 'التغابن', 'الطلاق', 'التحريم', 'الملك', 'القلم', 'الحاقة', 'المعارج', 'نوح', 'الجن', 'المزمل', 'المدثر', 'القيامة', 'الإنسان', 'المرسلات', 'النبأ', 'النازعات', 'عبس', 'التكوير', 'الانفطار', 'المطففين', 'الانشقاق', 'البروج', 'الطارق', 'الأعلى', 'الغاشية', 'الفجر', 'البلد', 'الشمس', 'الليل', 'الضحى', 'الشرح', 'التين', 'العلق', 'القدر', 'البينة', 'الزلزلة', 'العاديات', 'القارعة', 'التكاثر', 'العصر', 'الهمزة', 'الفيل', 'قريش', 'الماعون', 'الكوثر', 'الكافرون', 'النصر', 'المسد', 'الإخلاص', 'الفلق', 'الناس'
        ];
        const surahsContainer = document.getElementById('surahsContainer');
        surahsList.forEach((surah, index) => {
            surahsContainer.innerHTML += `
                <label class="flex items-center space-x-2 space-x-reverse cursor-pointer hover:bg-emerald-50 p-2 rounded transition border border-transparent hover:border-emerald-200">
                    <input type="checkbox" name="surah_check" value="${surah}" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
                    <span class="text-sm font-bold text-gray-700">${index + 1}. ${surah}</span>
                </label>
            `;
        });

        // التبديل بين إدخال الأجزاء والسور
        function togglePlanInputs() {
            const planType = document.querySelector('input[name="planType"]:checked').value;
            if(planType === 'parts') {
                document.getElementById('partsInputGroup').classList.remove('hidden');
                document.getElementById('surahsInputGroup').classList.add('hidden');
            } else {
                document.getElementById('partsInputGroup').classList.add('hidden');
                document.getElementById('surahsInputGroup').classList.remove('hidden');
            }
        }

        window.addEventListener('load', async () => {
            const { data: { user } } = await window.supabase.auth.getUser();
            if(!user) return window.location.href = 'login.html';
            currentUserId = user.id;
            
            const { data: students } = await window.supabase.from('student_profiles')
                .select('user_id, users!student_profiles_user_id_fkey(full_name)')
                .eq('teacher_id', currentUserId)
                .eq('evaluation_status', 'pending');
                
            const sSelect = document.getElementById('studentSelect');
            sSelect.innerHTML = '<option value="">-- اختر طالباً --</option>';
            if(students && students.length > 0) {
                students.forEach(s => sSelect.innerHTML += `<option value="${s.user_id}">${s.users.full_name}</option>`);
            } else {
                sSelect.innerHTML = '<option value="">لا يوجد طلاب بانتظار التقييم حالياً</option>';
            }
        });

        // حفظ التقييم والخطة
        document.getElementById('evaluationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveEvalBtn');
            const msg = document.getElementById('evalMsg');
            
            const studentId = document.getElementById('studentSelect').value;
            const level = document.getElementById('levelSelect').value;
            const planType = document.querySelector('input[name="planType"]:checked').value;
            
            let partsStr = null, surahsStr = null;
            
            if (planType === 'parts') {
                // تجميع الأجزاء المحددة
                const checkedParts = Array.from(document.querySelectorAll('input[name="juz_check"]:checked')).map(cb => cb.value);
                if(checkedParts.length === 0) return alert('الرجاء تحديد جزء واحد على الأقل!');
                partsStr = checkedParts.join('، '); // دمجها في نص واحد
            } else {
                // تجميع السور المحددة
                const checkedSurahs = Array.from(document.querySelectorAll('input[name="surah_check"]:checked')).map(cb => cb.value);
                if(checkedSurahs.length === 0) return alert('الرجاء تحديد سورة واحدة على الأقل!');
                surahsStr = checkedSurahs.join('، '); // دمجها في نص واحد
            }
            
            if(!studentId) return alert('الرجاء التأكد من اختيار الطالب!');
            
            btn.disabled = true; btn.textContent = 'جاري الاعتماد...';
            msg.classList.add('hidden');

            const { error } = await window.supabase.from('student_profiles')
                .update({ 
                    evaluation_status: 'completed', 
                    student_level: level,
                    custom_plan_type: planType,
                    target_parts: partsStr,    // تخزين النص المدمج (مثل: الجزء 1، الجزء 2)
                    target_surahs: surahsStr   // تخزين النص المدمج (مثل: البقرة، آل عمران)
                })
                .eq('user_id', studentId);

            if(error) {
                msg.textContent = 'خطأ: ' + error.message;
                msg.className = 'text-center p-3 rounded font-bold mt-4 bg-red-100 text-red-700 block';
                btn.disabled = false; btn.textContent = 'اعتماد التقييم والخطة';
            } else {
                msg.textContent = 'تم إنجاز التقييم بنجاح وتحديد خطة الطالب بدقة!';
                msg.className = 'text-center p-3 rounded font-bold mt-4 bg-emerald-100 text-emerald-700 block';
                setTimeout(() => window.location.href = 'teacher_dashboard.html', 2000);
            }
        });
    </script>
</body>
</html>
