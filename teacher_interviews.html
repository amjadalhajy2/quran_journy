<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>التقييم المبدئي والدوري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap'); body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">
    <aside class="w-64 bg-[#1e293b] text-white flex flex-col hidden md:flex z-20">
        <div class="p-6 text-xl font-bold border-b border-gray-700 text-emerald-400"><i class="fas fa-book-reader mr-2 ml-2"></i> بوابة المعلم</div>
        <nav class="flex-1 p-4 space-y-2 text-sm font-medium">
            <a href="teacher_dashboard.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-home ml-3"></i> الرئيسية</a>
            <a href="teacher_students_list.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-users ml-3"></i> قائمة طلابي</a>
            <a href="teacher_interviews.html" class="flex items-center bg-emerald-600 px-4 py-3 rounded-lg text-white shadow"><i class="fas fa-clipboard-list ml-3"></i> التقييم المبدئي والدوري</a>
            <a href="teacher_virtual_session.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300"><i class="fas fa-video ml-3"></i> غرفة الإقراء</a>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 bg-gray-50">
        <h2 class="text-2xl font-bold text-gray-700 mb-6">إجراء تقييم وتحديد مستوى</h2>
        
        <div class="bg-white p-8 rounded-xl shadow-sm border max-w-4xl">
            <form id="evaluationForm" class="space-y-8">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border-b pb-6">
                    <div>
                        <label class="block font-bold text-sm mb-2 text-gray-700">اختر الطالب (بانتظار التقييم)</label>
                        <select id="studentSelect" onchange="handleStudentSelection()" class="w-full border rounded-lg p-3 bg-gray-50 focus:border-emerald-500 font-bold" required>
                            <option value="">جاري تحميل الطلاب...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-sm mb-2 text-gray-700">مستوى الطالب (نتيجة التقييم)</label>
                        <select id="levelSelect" class="w-full border rounded-lg p-3 bg-white focus:border-emerald-500 font-bold" required>
                            <option value="مبتدئ">مبتدئ (تأسيس وتلقين)</option>
                            <option value="متوسط">متوسط (تلاوة وأحكام)</option>
                            <option value="متقدم">متقدم (حفظ وإتقان)</option>
                        </select>
                    </div>
                </div>

                <!-- قسم جدولة الحصص الديناميكي -->
                <div id="scheduleSection" class="border-b pb-6 hidden">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-emerald-700"><i class="far fa-calendar-alt ml-2"></i> جدولة الحصص الأسبوعية</h3>
                        <span id="packageInfoBadge" class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-xs font-bold"></span>
                    </div>
                    <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg text-sm text-blue-800 font-bold mb-4">
                        <i class="fas fa-info-circle ml-1"></i> بناءً على باقة الطالب، قم بتحديد أيام وأوقات الحصص. سيقوم النظام بجدولتها لمدة شهر كامل للأمام تلقائياً.
                    </div>
                    
                    <!-- سيتم توليد حقول الأيام والأوقات هنا -->
                    <div id="scheduleInputsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>

                <!-- بناء الخطة المخصصة الذكية -->
                <div class="border-b pb-6">
                    <h3 class="font-bold text-emerald-700 mb-4"><i class="fas fa-route ml-2"></i> بناء خطة الحفظ (تحديد المقرر)</h3>
                    <div class="flex space-x-6 space-x-reverse mb-4 bg-gray-100 p-3 rounded-lg inline-flex">
                        <label class="flex items-center font-bold cursor-pointer">
                            <input type="radio" name="planType" value="parts" checked class="w-4 h-4 text-emerald-600 focus:ring-emerald-500 ml-2" onchange="togglePlanInputs()"> 
                            تحديد بالأجزاء
                        </label>
                        <label class="flex items-center font-bold cursor-pointer border-r border-gray-300 pr-6">
                            <input type="radio" name="planType" value="surahs" class="w-4 h-4 text-emerald-600 focus:ring-emerald-500 ml-2" onchange="togglePlanInputs()"> 
                            تحديد بالسور
                        </label>
                    </div>

                    <div id="partsInputGroup" class="bg-emerald-50 p-4 rounded-lg border border-emerald-200">
                        <label class="block font-bold text-sm mb-3 text-emerald-800"><i class="fas fa-check-square ml-1"></i> حدد الأجزاء المراد حفظها:</label>
                        <div id="juzContainer" class="h-48 overflow-y-auto border border-emerald-100 rounded-lg p-3 bg-white grid grid-cols-2 md:grid-cols-4 gap-3 shadow-inner"></div>
                    </div>

                    <div id="surahsInputGroup" class="bg-emerald-50 p-4 rounded-lg border border-emerald-200 hidden">
                        <label class="block font-bold text-sm mb-3 text-emerald-800"><i class="fas fa-check-square ml-1"></i> حدد السور المراد حفظها:</label>
                        <div id="surahsContainer" class="h-56 overflow-y-auto border border-emerald-100 rounded-lg p-3 bg-white grid grid-cols-2 md:grid-cols-4 gap-3 shadow-inner"></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border-b pb-6">
                    <div>
                        <label class="block font-bold text-sm mb-2 text-gray-700">جودة التلاوة المبدئية (من 10)</label>
                        <input type="range" min="1" max="10" value="5" class="w-full accent-emerald-600" oninput="document.getElementById('tajweedScore').innerText = this.value">
                        <div class="text-center font-black text-2xl text-emerald-600 mt-2" id="tajweedScore">5</div>
                    </div>
                    <div>
                        <label class="block font-bold text-sm mb-2 text-gray-700">ملاحظات المعلم وتوصياته للطالب</label>
                        <textarea id="evalNotes" rows="3" class="w-full border rounded-lg p-3 focus:border-emerald-500" required></textarea>
                    </div>
                </div>
                
                <div id="evalMsg" class="hidden text-center p-3 rounded font-bold mt-4"></div>

                <div class="flex justify-end pt-4">
                    <button type="submit" id="saveEvalBtn" class="bg-emerald-600 text-white px-8 py-3 rounded-lg font-bold shadow hover:bg-emerald-700 transition">
                        <i class="fas fa-save ml-2"></i> اعتماد التقييم والجدول
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        let currentUserId = null;
        let pendingStudentsData = []; // لحفظ تفاصيل الباقات للطلاب

        // توليد قوائم الأجزاء والسور
        const juzContainer = document.getElementById('juzContainer');
        for(let i=1; i<=30; i++) {
            juzContainer.innerHTML += `<label class="flex items-center space-x-2 space-x-reverse cursor-pointer hover:bg-emerald-50 p-2 rounded transition border border-transparent hover:border-emerald-200"><input type="checkbox" name="juz_check" value="الجزء ${i}" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500"><span class="text-sm font-bold text-gray-700">الجزء ${i}</span></label>`;
        }
        const surahsList = ['الفاتحة', 'البقرة', 'آل عمران', 'النساء', 'المائدة', 'الأنعام', 'الأعراف', 'الأنفال', 'التوبة', 'يونس', 'هود', 'يوسف', 'الرعد', 'إبراهيم', 'الحجر', 'النحل', 'الإسراء', 'الكهف', 'مريم', 'طه', 'الأنبياء', 'الحج', 'المؤمنون', 'النور', 'الفرقان', 'الشعراء', 'النمل', 'القصص', 'العنكبوت', 'الروم', 'لقمان', 'السجدة', 'الأحزاب', 'سبأ', 'فاطر', 'يس', 'الصافات', 'ص', 'الزمر', 'غافر', 'فصلت', 'الشورى', 'الزخرف', 'الدخان', 'الجاثية', 'الأحقاف', 'محمد', 'الفتح', 'الحجرات', 'ق', 'الذاريات', 'الطور', 'النجم', 'القمر', 'الرحمن', 'الواقعة', 'الحديد', 'المجادلة', 'الحشر', 'الممتحنة', 'الصف', 'الجمعة', 'المنافقون', 'التغابن', 'الطلاق', 'التحريم', 'الملك', 'القلم', 'الحاقة', 'المعارج', 'نوح', 'الجن', 'المزمل', 'المدثر', 'القيامة', 'الإنسان', 'المرسلات', 'النبأ', 'النازعات', 'عبس', 'التكوير', 'الانفطار', 'المطففين', 'الانشقاق', 'البروج', 'الطارق', 'الأعلى', 'الغاشية', 'الفجر', 'البلد', 'الشمس', 'الليل', 'الضحى', 'الشرح', 'التين', 'العلق', 'القدر', 'البينة', 'الزلزلة', 'العاديات', 'القارعة', 'التكاثر', 'العصر', 'الهمزة', 'الفيل', 'قريش', 'الماعون', 'الكوثر', 'الكافرون', 'النصر', 'المسد', 'الإخلاص', 'الفلق', 'الناس'];
        const surahsContainer = document.getElementById('surahsContainer');
        surahsList.forEach((surah, index) => {
            surahsContainer.innerHTML += `<label class="flex items-center space-x-2 space-x-reverse cursor-pointer hover:bg-emerald-50 p-2 rounded transition border border-transparent hover:border-emerald-200"><input type="checkbox" name="surah_check" value="${surah}" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500"><span class="text-sm font-bold text-gray-700">${index + 1}. ${surah}</span></label>`;
        });

        function togglePlanInputs() {
            const planType = document.querySelector('input[name="planType"]:checked').value;
            if(planType === 'parts') {
                document.getElementById('partsInputGroup').classList.remove('hidden');
                document.getElementById('surahsInputGroup').classList.add('hidden');
            } else {
                document.getElementById('partsInputGroup').classList.add('hidden');
                document.getElementById('surahsInputGroup').classList.remove('hidden');
            }
        }

        window.addEventListener('load', async () => {
            const { data: { user } } = await window.supabase.auth.getUser();
            if(!user) return window.location.href = 'login.html';
            currentUserId = user.id;
            
            // جلب الطلاب بانتظار التقييم مع تفاصيل باقاتهم باستخدام الدالة الذكية
            const { data: students, error } = await window.supabase.rpc('get_pending_eval_students', { p_teacher_id: currentUserId });
            
            const sSelect = document.getElementById('studentSelect');
            sSelect.innerHTML = '<option value="">-- اختر طالباً --</option>';
            
            if(students && students.length > 0) {
                pendingStudentsData = students;
                students.forEach(s => sSelect.innerHTML += `<option value="${s.user_id}">${s.full_name}</option>`);
            } else {
                sSelect.innerHTML = '<option value="">لا يوجد طلاب بانتظار التقييم حالياً</option>';
            }
        });

        // دالة توليد حقول الأوقات عند اختيار الطالب
        function handleStudentSelection() {
            const studentId = document.getElementById('studentSelect').value;
            const scheduleSection = document.getElementById('scheduleSection');
            const container = document.getElementById('scheduleInputsContainer');
            
            if(!studentId) {
                scheduleSection.classList.add('hidden');
                return;
            }

            const studentData = pendingStudentsData.find(s => s.user_id === studentId);
            document.getElementById('packageInfoBadge').textContent = `الاستحقاق: ${studentData.sessions_per_week} حصص | مدة الحصة: ${studentData.session_duration} دقيقة`;
            
            container.innerHTML = '';
            // توليد الحقول بناءً على عدد الحصص المستحقة
            for(let i=0; i<studentData.sessions_per_week; i++) {
                container.innerHTML += `
                    <div class="bg-white border p-4 rounded-lg flex space-x-4 space-x-reverse">
                        <div class="w-1/2">
                            <label class="block text-xs font-bold text-gray-500 mb-1">الحصة ${i+1}: اليوم</label>
                            <select class="schedule-day w-full border rounded p-2 text-sm font-bold bg-gray-50 outline-none focus:border-emerald-500" required>
                                <option value="">اختر اليوم...</option>
                                <option value="0">الأحد</option><option value="1">الإثنين</option><option value="2">الثلاثاء</option>
                                <option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option>
                            </select>
                        </div>
                        <div class="w-1/2">
                            <label class="block text-xs font-bold text-gray-500 mb-1">وقت البدء</label>
                            <input type="time" class="schedule-time w-full border rounded p-2 text-sm font-bold bg-gray-50 outline-none focus:border-emerald-500" required>
                        </div>
                    </div>
                `;
            }
            scheduleSection.classList.remove('hidden');
        }

        // دالة تحويل أوقات البدء إلى تواريخ وجلسات فعلية لمدة 4 أسابيع
        function generateSessionsArray(studentId, durationMins) {
            const daysSelects = document.querySelectorAll('.schedule-day');
            const timesInputs = document.querySelectorAll('.schedule-time');
            let weeklySchedule = [];
            
            // جمع اختيارات المعلم
            for(let i=0; i<daysSelects.length; i++) {
                weeklySchedule.push({ day: parseInt(daysSelects[i].value), time: timesInputs[i].value });
            }

            let sessionsToInsert = [];
            let today = new Date();
            
            // توليد التواريخ لـ 28 يوم قادم (4 أسابيع)
            for(let i=0; i<28; i++) {
                let currentDate = new Date(today);
                currentDate.setDate(today.getDate() + i);
                let currentDayNum = currentDate.getDay(); // 0-6

                // هل هذا اليوم ضمن جدول الطالب؟
                let matchedSchedule = weeklySchedule.find(s => s.day === currentDayNum);
                if(matchedSchedule) {
                    const dateStr = currentDate.toISOString().split('T')[0];
                    const startTimeStr = matchedSchedule.time;
                    
                    // حساب وقت الانتهاء بزيادة دقائق الباقة
                    let [hours, mins] = startTimeStr.split(':').map(Number);
                    let endDate = new Date(currentDate);
                    endDate.setHours(hours, mins + durationMins, 0, 0);
                    const endTimeStr = endDate.toTimeString().split(' ')[0].substring(0, 5); // HH:MM

                    sessionsToInsert.push({
                        teacher_id: currentUserId,
                        student_id: studentId,
                        session_date: dateStr,
                        start_time: startTimeStr + ':00',
                        end_time: endTimeStr + ':00',
                        status: 'scheduled'
                        scheduled_at: new Date().toISOString()
                    });
                }
            }
            return sessionsToInsert;
        }

        // حفظ التقييم والخطة والحصص
        document.getElementById('evaluationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveEvalBtn');
            const msg = document.getElementById('evalMsg');
            const studentId = document.getElementById('studentSelect').value;
            const level = document.getElementById('levelSelect').value;
            const planType = document.querySelector('input[name="planType"]:checked').value;
            
            let partsStr = null, surahsStr = null;
            if (planType === 'parts') {
                const checkedParts = Array.from(document.querySelectorAll('input[name="juz_check"]:checked')).map(cb => cb.value);
                if(checkedParts.length === 0) return alert('الرجاء تحديد جزء واحد على الأقل!');
                partsStr = checkedParts.join('، ');
            } else {
                const checkedSurahs = Array.from(document.querySelectorAll('input[name="surah_check"]:checked')).map(cb => cb.value);
                if(checkedSurahs.length === 0) return alert('الرجاء تحديد سورة واحدة على الأقل!');
                surahsStr = checkedSurahs.join('، ');
            }
            
            btn.disabled = true; btn.textContent = 'جاري الاعتماد...';
            msg.classList.add('hidden');

            // 1. استخراج الحصص المجدولة
            const studentData = pendingStudentsData.find(s => s.user_id === studentId);
            const generatedSessions = generateSessionsArray(studentId, studentData.session_duration);

            // 2. إدخال الحصص في جدول الحصص دفعة واحدة
            const { error: sessionError } = await window.supabase.from('sessions').insert(generatedSessions);
            if(sessionError) {
                alert('حدث خطأ أثناء جدولة الحصص: ' + sessionError.message);
                btn.disabled = false; btn.textContent = 'اعتماد التقييم والجدول';
                return;
            }

            // 3. تحديث ملف الطالب لإنهاء حالة التقييم
            const { error } = await window.supabase.from('student_profiles')
                .update({ 
                    evaluation_status: 'completed', 
                    student_level: level,
                    custom_plan_type: planType,
                    target_parts: partsStr,    
                    target_surahs: surahsStr   
                })
                .eq('user_id', studentId);

            if(error) {
                msg.textContent = 'تم جدولة الحصص ولكن حدث خطأ بملف الطالب: ' + error.message;
                msg.className = 'text-center p-3 rounded font-bold mt-4 bg-orange-100 text-orange-700 block';
                btn.disabled = false; btn.textContent = 'اعتماد التقييم والجدول';
            } else {
                msg.textContent = 'تم إنجاز التقييم، وتحديد الخطة، وجدولة حصص الشهر كاملة بنجاح!';
                msg.className = 'text-center p-3 rounded font-bold mt-4 bg-emerald-100 text-emerald-700 block';
                setTimeout(() => window.location.href = 'teacher_dashboard.html', 3000);
            }
        });
    </script>
</body>
</html>
