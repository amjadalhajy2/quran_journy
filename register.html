<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التسجيل كطالب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="py-10 flex justify-center items-center min-h-screen">
    
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-lg w-full border border-gray-100">
        <h2 class="text-3xl font-bold text-emerald-600 mb-2 text-center">طلب انضمام جديد</h2>
        <p class="text-gray-500 text-center mb-6">سيتم تحديد موعد مقابلة مبدئية بعد إتمام التسجيل</p>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-bold mb-1">الاسم الثلاثي</label>
                <input type="text" id="fullName" class="w-full border rounded-lg p-3 focus:outline-none focus:border-emerald-500" required>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" class="w-full border rounded-lg p-3 focus:outline-none focus:border-emerald-500" required>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-1">كلمة المرور</label>
                <input type="password" id="password" class="w-full border rounded-lg p-3 focus:outline-none focus:border-emerald-500" required>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-1">إيصال الدفع</label>
                <input type="file" id="receipt" accept="image/*,.pdf" class="w-full border rounded-lg p-2 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-emerald-50 file:text-emerald-700" required>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg hover:bg-emerald-700 transition">
                إرسال الطلب
            </button>
        </form>
    </div>

    <script src="supabase.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'جاري معالجة الطلب...';
            submitBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value;
            const file = document.getElementById('receipt').files[0];

            try {
                // 1. تسجيل المستخدم الجديد
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: { data: { full_name: fullName, role: 'student' } }
                });

                if (authError) throw authError;

                // 2. رفع الإيصال لـ Storage
                const fileExt = file.name.split('.').pop();
                const fileName = `${authData.user.id}_${Math.random()}.${fileExt}`;
                const { error: uploadError } = await supabase.storage
                    .from('payment-receipts')
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                // 3. ربط الإيصال بجدول الاشتراكات
                await supabase.from('subscriptions').insert([{
                    student_id: authData.user.id,
                    receipt_url: fileName,
                    status: 'pending'
                }]);

                alert('تم التسجيل بنجاح! سيتم مراجعة الإيصال وتحديد موعد المقابلة.');
                window.location.href = 'login.html';
                
            } catch (error) {
                console.error(error);
                alert('حدث خطأ أثناء التسجيل: ' + error.message);
                submitBtn.textContent = 'إرسال الطلب';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
