<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجديد الاشتراك - بوابة الطالب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> 
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap'); 
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; }
        .radio-card:checked + div { border-color: #059669; background-color: #ecfdf5; }
        .radio-card:checked + div .check-icon { display: block; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden relative">
        <div class="bg-emerald-800 text-white p-6 relative flex items-center">
            <a href="student_dashboard.html" class="absolute right-6 text-white bg-emerald-700 hover:bg-emerald-600 px-4 py-2 rounded transition font-bold"><i class="fas fa-arrow-right ml-2"></i> رجوع</a>
            <h2 class="text-2xl font-bold text-center w-full">تجديد باقة الاشتراك</h2>
        </div>

        <div class="p-8">
            <h3 class="text-xl font-bold text-gray-800 mb-6 border-b pb-2">أولاً: اختر الباقة المراد تجديدها</h3>
            
            <div id="packagesContainer" class="flex flex-col md:flex-row justify-center items-stretch gap-4 w-full mb-8">
                <p class="text-center text-gray-500 w-full py-8">جاري تحميل الباقات...</p>
            </div>

            <h3 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">ثانياً: أرفق الإيصال البنكي</h3>
            <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 mb-6 max-w-lg mx-auto">
                <div class="bg-white p-4 rounded-lg border border-dashed border-emerald-400 text-center">
                    <label class="block text-sm font-bold text-gray-700 mb-3">صورة إيصال التحويل (رقم الحساب: 123456789 - بنك مسقط)</label>
                    <input type="file" id="receiptFile" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" required>
                </div>
            </div>

            <div id="finalMsg" class="hidden text-center font-bold p-3 rounded-lg mb-4 max-w-lg mx-auto"></div>

            <div class="flex justify-center mt-6">
                <button id="submitBtn" onclick="submitRenewal()" class="bg-emerald-600 text-white px-12 py-4 rounded-lg font-bold shadow-lg hover:bg-emerald-700 transition w-full max-w-lg">
                    <i class="fas fa-paper-plane ml-2"></i> إرسال طلب التجديد
                </button>
            </div>
        </div>
    </div>

    <script src="supabase.js"></script>
    <script>
        let studentUserId = null;
        let selectedPackage = null;

        window.addEventListener('load', async () => {
            const { data: { user } } = await window.supabase.auth.getUser();
            if(!user) return window.location.href = 'login.html';
            studentUserId = user.id;

            const { data: pkgs } = await window.supabase.from('packages').select('*').eq('is_active', true).order('price', { ascending: true });
            const pCont = document.getElementById('packagesContainer');
            pCont.innerHTML = '';
            
            if(pkgs && pkgs.length > 0) {
                pkgs.forEach(p => {
                    pCont.innerHTML += `
                        <label class="relative cursor-pointer flex-1 min-w-[200px]">
                            <input type="radio" name="package_id" value="${p.id}" class="radio-card sr-only" onchange="selectedPackage = this.value">
                            <div class="border-2 border-gray-200 rounded-xl p-6 hover:border-emerald-300 transition h-full bg-white relative flex flex-col text-center">
                                <div class="check-icon absolute top-4 left-4 text-emerald-600 hidden"><i class="fas fa-check-circle text-xl"></i></div>
                                <h4 class="text-lg font-bold text-gray-800">${p.name}</h4>
                                <p class="text-3xl font-black text-emerald-600 my-4">${p.price} <span class="text-sm text-gray-500 font-normal">ريال</span></p>
                            </div>
                        </label>`;
                });
            } else {
                pCont.innerHTML = '<p class="text-red-500 font-bold">لا توجد باقات متاحة حالياً.</p>';
            }
        });

        async function submitRenewal() {
            if(!selectedPackage) return alert('الرجاء اختيار باقة للاستمرار');
            
            const fileInput = document.getElementById('receiptFile');
            if(!fileInput.files || fileInput.files.length === 0) return alert('الرجاء إرفاق صورة الإيصال لاعتماد الطلب');

            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('finalMsg');
            btn.disabled = true; btn.textContent = 'جاري إرسال الطلب...';
            msg.classList.add('hidden');

            try {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `renewal_${studentUserId}_${Date.now()}.${fileExt}`;
                
                // رفع الإيصال
                const { error: uploadError } = await window.supabase.storage.from('payment-receipts').upload(fileName, file);
                if(uploadError) throw new Error("خطأ في رفع الإيصال: " + uploadError.message);

                // إدراج اشتراك جديد معلق
                const { error: subError } = await window.supabase.from('subscriptions').insert({
                    user_id: studentUserId,
                    student_id: studentUserId,
                    package_id: selectedPackage,
                    receipt_url: fileName,
                    status: 'pending'
                });
                if(subError) throw new Error("خطأ في تسجيل الطلب: " + subError.message);

                msg.textContent = '🎉 تم إرسال طلب التجديد بنجاح! سيتم مراجعته وتفعيله قريباً.';
                msg.className = 'text-emerald-700 bg-emerald-100 font-bold p-3 rounded-lg block text-center';
                setTimeout(() => { window.location.href = 'student_dashboard.html'; }, 3000);

            } catch (err) {
                msg.textContent = err.message;
                msg.className = 'text-red-700 bg-red-100 font-bold p-3 rounded-lg block text-center';
                btn.disabled = false; btn.textContent = 'إرسال طلب التجديد';
            }
        }
    </script>
</body>
</html>
