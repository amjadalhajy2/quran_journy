<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير النظام - لوحة المؤشرات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap'); body { font-family: 'Tajawal', sans-serif; background-color: #f4f7f6; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">

    <!-- القائمة الجانبية الموحدة لجميع صفحات الإدارة -->
    <aside class="w-64 bg-[#1a2b3c] text-white flex flex-col hidden md:flex shadow-2xl z-20">
        <div class="p-6 text-xl font-bold border-b border-gray-700 flex items-center">
            <i class="fas fa-shield-alt text-emerald-400 mr-2 ml-2"></i> الإدارة العليا
        </div>
        <nav class="flex-1 p-4 space-y-2 text-sm font-medium">
            <a href="admin_dashboard.html" class="flex items-center bg-emerald-600 px-4 py-3 rounded-lg text-white shadow"><i class="fas fa-chart-pie ml-3"></i> لوحة المؤشرات</a>
            <a href="admin_teachers.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-chalkboard-teacher ml-3"></i> إدارة المعلمين</a>
            <a href="admin_new_registrations.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-user-plus ml-3"></i> طلبات التسجيل الجديدة</a>
            <a href="admin_students.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-user-graduate ml-3"></i> إدارة الطلاب المنتظمين</a>
            <a href="admin_finances.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-file-invoice-dollar ml-3"></i> الإدارة المالية</a>
            <a href="admin_packages.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-box ml-3"></i> إدارة الباقات</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto bg-gray-50">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center border-b border-gray-200 sticky top-0 z-10">
            <h2 class="text-2xl font-bold text-gray-700">التصور التحليلي للبيانات</h2>
            <button onclick="logout()" class="text-red-500 font-bold hover:bg-red-50 px-4 py-2 rounded-lg transition"><i class="fas fa-sign-out-alt ml-2"></i> تسجيل الخروج</button>
        </header>

        <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-bold mb-1">الطلاب النشطين</p>
                        <h3 class="text-3xl font-black text-gray-800" id="stat-students">--</h3>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xl"><i class="fas fa-user-graduate"></i></div>
                </div>
                
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-bold mb-1">المعلمين المعتمدين</p>
                        <h3 class="text-3xl font-black text-gray-800" id="stat-teachers">--</h3>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-xl"><i class="fas fa-chalkboard-teacher"></i></div>
                </div>

                <div class="bg-gradient-to-l from-emerald-600 to-emerald-500 p-6 rounded-xl shadow-md text-white flex items-center justify-between">
                    <div>
                        <p class="text-emerald-100 text-sm font-bold mb-1">استقبال التسجيل</p>
                        <h3 class="text-2xl font-bold" id="reg-status-text">جاري التحقق...</h3>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="reg-toggle" class="sr-only peer">
                        <div class="w-11 h-6 bg-emerald-800 peer-focus:outline-none rounded-full peer peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-white"></div>
                    </label>
                </div>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        async function loadDashboard() {
            // جلب أعداد الطلاب
            const { count: studentCount } = await window.supabase.from('users').select('*', { count: 'exact', head: true }).eq('role', 'student');
            document.getElementById('stat-students').textContent = studentCount || 0;

            // جلب أعداد المعلمين
            const { count: teacherCount } = await window.supabase.from('users').select('*', { count: 'exact', head: true }).eq('role', 'teacher');
            document.getElementById('stat-teachers').textContent = teacherCount || 0;

            // حالة التسجيل
            const { data: settings } = await window.supabase.from('system_settings').select('is_registration_open').single();
            const toggle = document.getElementById('reg-toggle');
            const statusText = document.getElementById('reg-status-text');
            
            if(settings) {
                toggle.checked = settings.is_registration_open;
                statusText.textContent = settings.is_registration_open ? 'مفتوح' : 'مغلق';
            }

            toggle.addEventListener('change', async (e) => {
                const isOpen = e.target.checked;
                statusText.textContent = isOpen ? 'مفتوح' : 'مغلق';
                await window.supabase.from('system_settings').update({ is_registration_open: isOpen }).eq('id', 1);
            });
        }
        async function logout() { await window.supabase.auth.signOut(); window.location.href = 'login.html'; }
        window.addEventListener('load', loadDashboard);
    </script>
</body>
</html>
