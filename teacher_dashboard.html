<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة المعلم - الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap'); body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">
    
    <aside class="w-64 bg-[#1e293b] text-white flex flex-col hidden md:flex shadow-2xl z-20">
        <div class="p-6 text-xl font-bold border-b border-gray-700 flex items-center text-emerald-400">
            <i class="fas fa-book-reader mr-2 ml-2"></i> بوابة المعلم
        </div>
        <nav class="flex-1 p-4 space-y-2 text-sm font-medium">
            <a href="teacher_dashboard.html" class="flex items-center bg-emerald-600 px-4 py-3 rounded-lg text-white shadow"><i class="fas fa-home ml-3"></i> الرئيسية</a>
            <a href="teacher_students_list.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-users ml-3"></i> قائمة طلابي</a>
            <a href="teacher_interviews.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-clipboard-list ml-3"></i> التقييم المبدئي والدوري</a>
            <a href="teacher_virtual_session.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-video ml-3"></i> غرفة الإقراء الافتراضية</a>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-10 sticky top-0 border-b">
            <h2 class="text-xl font-bold text-gray-700">مرحباً بك، <span id="teacherName" class="text-emerald-600">...</span></h2>
            <button onclick="logout()" class="text-red-500 hover:bg-red-50 px-4 py-2 rounded-lg font-bold transition"><i class="fas fa-sign-out-alt ml-2"></i>خروج</button>
        </header>

        <div class="p-8 space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-emerald-100 flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-bold mb-1">إجمالي طلابك</p>
                        <h3 class="text-3xl font-black text-emerald-600" id="statStudents">0</h3>
                    </div>
                    <div class="bg-emerald-50 p-4 rounded-full text-emerald-500 text-2xl"><i class="fas fa-user-graduate"></i></div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-blue-100 flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-bold mb-1">حصصك لليوم (الفعلي)</p>
                        <h3 class="text-3xl font-black text-blue-600" id="statSessionsToday">0</h3>
                    </div>
                    <div class="bg-blue-50 p-4 rounded-full text-blue-500 text-2xl"><i class="fas fa-calendar-day"></i></div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-orange-100 flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-bold mb-1">طلاب بانتظار التقييم</p>
                        <h3 class="text-3xl font-black text-orange-600" id="statPendingEval">0</h3>
                    </div>
                    <div class="bg-orange-50 p-4 rounded-full text-orange-500 text-2xl"><i class="fas fa-user-clock"></i></div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border p-6">
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <h3 class="font-bold text-lg text-emerald-700"><i class="fas fa-calendar-week ml-2"></i> الجدول الأسبوعي للحلقات</h3>
                    <div class="flex items-center bg-gray-100 rounded-lg p-1">
                        <button onclick="changeWeek(1)" class="px-4 py-1 hover:bg-white rounded text-gray-600 font-bold shadow-sm transition"><i class="fas fa-chevron-right"></i> الأسبوع القادم</button>
                        <span id="weekDisplay" class="px-4 font-bold text-emerald-700 text-sm">الأسبوع الحالي</span>
                        <button onclick="changeWeek(-1)" class="px-4 py-1 hover:bg-white rounded text-gray-600 font-bold shadow-sm transition">الأسبوع السابق <i class="fas fa-chevron-left"></i></button>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-3 min-w-[800px] overflow-x-auto" id="calendarGrid"></div>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        let currentUserId = null;
        let currentWeekOffset = 0; 

        // دالة مساعدة لاستخراج التاريخ المحلي بدقة متناهية بعيداً عن أخطاء التوقيت العالمي (UTC)
        function getLocalDateString(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        window.addEventListener('load', async () => {
            const { data: { user } } = await window.supabase.auth.getUser();
            if(!user) return window.location.href = 'login.html';
            currentUserId = user.id;
            
            document.getElementById('teacherName').textContent = user.user_metadata?.full_name || 'أستاذي';

            const { count: totalStudents } = await window.supabase.from('student_profiles').select('*', { count: 'exact', head: true }).eq('teacher_id', currentUserId);
            document.getElementById('statStudents').textContent = totalStudents || 0;

            const { count: pendingEval } = await window.supabase.from('student_profiles').select('*', { count: 'exact', head: true }).eq('teacher_id', currentUserId).eq('evaluation_status', 'pending');
            document.getElementById('statPendingEval').textContent = pendingEval || 0;

            loadCalendar();
        });

        async function loadCalendar() {
            const today = new Date();
            const currentDay = today.getDay(); 
            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - currentDay + (currentWeekOffset * 7));
            startOfWeek.setHours(0,0,0,0);
            
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23,59,59,999);

            const startStr = getLocalDateString(startOfWeek);
            const endStr = getLocalDateString(endOfWeek);

            document.getElementById('weekDisplay').textContent = `${startOfWeek.toLocaleDateString('ar-OM', {month:'short', day:'numeric'})} - ${endOfWeek.toLocaleDateString('ar-OM', {month:'short', day:'numeric'})}`;

            const { data: sessions } = await window.supabase.from('sessions')
                .select('student_id, session_date, start_time, end_time, status, users!sessions_student_id_fkey(full_name)')
                .eq('teacher_id', currentUserId)
                .gte('session_date', startStr)
                .lte('session_date', endStr);

            const daysNames = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            let todaySessionsCount = 0;
            const actualTodayString = getLocalDateString(new Date());

            for(let i=0; i<7; i++) {
                const dayDate = new Date(startOfWeek);
                dayDate.setDate(startOfWeek.getDate() + i);
                const dateString = getLocalDateString(dayDate);
                
                const daySessions = (sessions || []).filter(s => s.session_date === dateString);
                
                if(dateString === actualTodayString) {
                    todaySessionsCount = daySessions.length;
                }
                
                let colHtml = `<div class="bg-gray-50 border rounded-xl overflow-hidden min-h-[300px] flex flex-col">
                                <div class="bg-gray-200 text-center py-2 border-b">
                                    <h4 class="font-bold text-gray-700">${daysNames[i]}</h4>
                                    <span class="text-xs text-gray-500">${dayDate.toLocaleDateString('ar-OM', {month:'numeric', day:'numeric'})}</span>
                                </div>
                                <div class="p-2 space-y-2 flex-1">`;
                
                if(daySessions.length > 0) {
                    daySessions.sort((a,b) => a.start_time.localeCompare(b.start_time)).forEach(sess => {
                        const sTime = sess.start_time.substring(0,5);
                        const eTime = sess.end_time.substring(0,5);
                        
                        colHtml += `<a href="teacher_virtual_session.html?student_id=${sess.student_id}" class="block bg-emerald-100 border border-emerald-300 p-2 rounded text-sm relative transition cursor-pointer hover:bg-emerald-200 hover:shadow-md group">
                            <div class="font-bold text-emerald-800 text-xs mb-1 flex justify-between items-center">
                                <span><i class="far fa-clock"></i> ${sTime} - ${eTime}</span>
                                <i class="fas fa-video opacity-0 group-hover:opacity-100 text-emerald-700 transition"></i>
                            </div>
                            <div class="font-bold text-gray-800">${sess.users.full_name}</div>
                            <div class="text-[10px] text-emerald-600 mt-1 font-bold">بدء الحصة <i class="fas fa-arrow-left"></i></div>
                        </a>`;
                    });
                } else {
                    colHtml += `<div class="text-center text-gray-400 text-xs mt-4">لا توجد حلقات</div>`;
                }

                colHtml += `</div></div>`;
                grid.innerHTML += colHtml;
            }
            
            document.getElementById('statSessionsToday').textContent = todaySessionsCount;
        }

        function changeWeek(direction) {
            currentWeekOffset += direction;
            loadCalendar();
        }

        async function logout() {
            await window.supabase.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
