<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة التحفيظ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fas fa-quran"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">تسجيل الدخول للنظام</h2>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">البريد الإلكتروني</label>
                <input type="email" id="email" value="tilawah.journy@gmail.com" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">كلمة المرور</label>
                <input type="password" id="password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
            </div>
            
            <div id="errorMessage" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center font-bold border border-red-200"></div>

            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-emerald-700 transition flex justify-center items-center">
                <span id="btnText">دخول</span>
                <i id="loadingIcon" class="fas fa-spinner fa-spin ml-2 hidden"></i>
            </button>
        </form>
    </div>

    <!-- استدعاء الإعدادات -->
    <script src="supabase.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const loadingIcon = document.getElementById('loadingIcon');

            // تفعيل حالة التحميل
            errorDiv.classList.add('hidden');
            loadingIcon.classList.remove('hidden');
            btnText.textContent = 'جاري التحقق...';
            submitBtn.disabled = true;

            try {
                // 1. المصادقة مع Supabase
                const { data: authData, error: authError } = await window.supabase.auth.signInWithPassword({ email, password });

                if (authError) {
                    throw new Error("بيانات الدخول خاطئة: " + authError.message);
                }

                // 2. جلب الصلاحيات
                const { data: userData, error: userError } = await window.supabase
                    .from('users')
                    .select('role')
                    .eq('id', authData.user.id)
                    .single();

                if (userError || !userData) {
                    throw new Error("تم الدخول، لكن حسابك غير مسجل في جدول المستخدمين العام.");
                }

                // 3. التوجيه بناءً على الصلاحية
                if (userData.role === 'admin') window.location.href = 'admin_dashboard.html';
                else if (userData.role === 'teacher') window.location.href = 'teacher_dashboard.html';
                else window.location.href = 'student_dashboard.html';

            } catch (err) {
                // عرض الخطأ الفعلي للمستخدم
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
                loadingIcon.classList.add('hidden');
                btnText.textContent = 'دخول';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
