<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الإدارة المالية - منصة التحفيظ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap'); body { font-family: 'Tajawal', sans-serif; background-color: #f4f7f6; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">
    <aside class="w-64 bg-[#1a2b3c] text-white flex flex-col hidden md:flex z-20">
        <div class="p-6 text-xl font-bold border-b border-gray-700"><i class="fas fa-shield-alt text-emerald-400 mr-2 ml-2"></i> الإدارة العليا</div>
        <nav class="flex-1 p-4 space-y-2 text-sm font-medium">
            <a href="admin_dashboard.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800"><i class="fas fa-chart-pie ml-3"></i> لوحة المؤشرات</a>
            <a href="admin_teachers.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800"><i class="fas fa-chalkboard-teacher ml-3"></i> إدارة المعلمين</a>
            <a href="admin_new_registrations.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800"><i class="fas fa-user-plus ml-3"></i> طلبات التسجيل</a>
            <a href="admin_students.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800"><i class="fas fa-user-graduate ml-3"></i> الطلاب المنتظمين</a>
            <a href="admin_finances.html" class="flex items-center bg-emerald-600 px-4 py-3 rounded-lg"><i class="fas fa-file-invoice-dollar ml-3"></i> الإدارة المالية</a>
            <a href="admin_packages.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800"><i class="fas fa-box ml-3"></i> إدارة الباقات</a>
            <a href="admin_curriculum.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800"><i class="fas fa-book-open ml-3"></i> إدارة المقررات</a>
        </nav>
    </aside>
    <main class="flex-1 overflow-y-auto p-8">
        <div class="bg-white p-6 rounded-xl shadow-sm border mb-8 flex items-center justify-between">
            <div><h3 class="text-gray-500 font-bold">إجمالي الإيرادات المعتمدة</h3>
            <p id="totalRevenue" class="text-4xl font-black text-emerald-600 mt-2">0 ريال</p></div>
            <i class="fas fa-coins text-5xl text-emerald-100"></i>
        </div>
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <table class="w-full text-right text-sm">
                <thead class="bg-gray-50 border-b"><tr><th class="px-6 py-4">التاريخ</th><th class="px-6 py-4">الطالب</th><th class="px-6 py-4">المبلغ</th><th class="px-6 py-4">الإيصال</th><th class="px-6 py-4">الحالة</th></tr></thead>
                <tbody id="financeTable"><tr><td colspan="5" class="p-8 text-center">جاري التحميل...</td></tr></tbody>
            </table>
        </div>
    </main>
    <script src="supabase.js"></script>
    <script>
        async function loadFinances() {
            const { data, error } = await window.supabase.from('subscriptions')
                .select(`id, created_at, status, receipt_url, packages(price), users!subscriptions_user_id_fkey(full_name)`)
                .order('created_at', { ascending: false });
            
            let total = 0;
            const tbody = document.getElementById('financeTable'); tbody.innerHTML = '';
            
            if(data) {
                data.forEach(req => {
                    const date = new Date(req.created_at).toLocaleDateString('ar-OM');
                    const url = window.supabase.storage.from('payment-receipts').getPublicUrl(req.receipt_url).data.publicUrl;
                    let statusHtml = '';
                    if(req.status === 'approved') { statusHtml = '<span class="bg-green-100 text-green-700 px-2 py-1 rounded font-bold">معتمد</span>'; total += req.packages.price; }
                    else if(req.status === 'rejected') statusHtml = '<span class="bg-red-100 text-red-700 px-2 py-1 rounded font-bold">مرفوض</span>';
                    else statusHtml = '<span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded font-bold">معلق</span>';

                    tbody.innerHTML += `<tr class="hover:bg-gray-50 border-b"><td class="px-6 py-4 text-gray-500">${date}</td><td class="px-6 py-4 font-bold">${req.users.full_name}</td><td class="px-6 py-4 font-bold text-emerald-600">${req.packages.price} ريال</td><td class="px-6 py-4"><a href="${url}" target="_blank" class="text-blue-600 font-bold"><i class="fas fa-eye"></i> عرض</a></td><td class="px-6 py-4">${statusHtml}</td></tr>`;
                });
                document.getElementById('totalRevenue').textContent = total + ' ريال';
            }
        }
        window.addEventListener('load', loadFinances);
    </script>
</body>
</html>
