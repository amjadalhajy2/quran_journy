<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مدير النظام - الإدارة المالية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; background-color: #f4f7f6; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">
    <!-- انسخ نفس القائمة الجانبية هنا -->
    
    <main class="flex-1 flex flex-col overflow-y-auto bg-gray-50">
        <header class="bg-white shadow-sm p-4 border-b">
            <h2 class="text-2xl font-bold text-gray-700">مراجعة الإيصالات والمالية</h2>
        </header>

        <div class="p-8">
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-right text-sm">
                    <thead class="bg-gray-50 text-gray-500 border-b">
                        <tr>
                            <th class="px-6 py-4">رقم الاشتراك</th>
                            <th class="px-6 py-4">الإيصال المرفق</th>
                            <th class="px-6 py-4">تاريخ الرفع</th>
                            <th class="px-6 py-4">القرار</th>
                        </tr>
                    </thead>
                    <tbody id="receiptsTable" class="divide-y divide-gray-100">
                        <tr><td colspan="4" class="px-6 py-4 text-center">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        async function loadFinances() {
            // جلب الاشتراكات المعلقة
            const { data: subs } = await window.supabase.from('subscriptions').select('*').eq('status', 'pending');
            const tbody = document.getElementById('receiptsTable');
            tbody.innerHTML = '';
            
            if(subs && subs.length > 0) {
                subs.forEach(sub => {
                    const date = new Date(sub.created_at).toLocaleDateString('ar-OM');
                    // جلب الرابط العام للصورة من Storage
                    const { data: fileData } = window.supabase.storage.from('payment-receipts').getPublicUrl(sub.receipt_url);
                    
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 font-mono text-gray-500">#${sub.id.substring(0,8)}</td>
                            <td class="px-6 py-4">
                                <a href="${fileData.publicUrl}" target="_blank" class="text-blue-500 font-bold hover:underline"><i class="fas fa-image mr-1"></i> عرض الإيصال</a>
                            </td>
                            <td class="px-6 py-4">${date}</td>
                            <td class="px-6 py-4">
                                <button class="bg-emerald-500 text-white px-3 py-1 rounded shadow hover:bg-emerald-600 ml-2">اعتماد</button>
                                <button class="bg-red-500 text-white px-3 py-1 rounded shadow hover:bg-red-600">رفض</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-gray-400">لا توجد إيصالات بانتظار المراجعة.</td></tr>';
            }
        }
        window.addEventListener('load', loadFinances);
    </script>
</body>
</html>
