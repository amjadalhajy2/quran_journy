<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة المعلم - قائمة طلابي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap'); body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">
    
    <aside class="w-64 bg-[#1e293b] text-white flex flex-col hidden md:flex z-20">
        <div class="p-6 text-xl font-bold border-b border-gray-700 text-emerald-400"><i class="fas fa-book-reader mr-2 ml-2"></i> بوابة المعلم</div>
        <nav class="flex-1 p-4 space-y-2 text-sm font-medium">
            <a href="teacher_dashboard.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-home ml-3"></i> الرئيسية</a>
            <a href="teacher_students_list.html" class="flex items-center bg-emerald-600 px-4 py-3 rounded-lg text-white shadow"><i class="fas fa-users ml-3"></i> قائمة طلابي</a>
            <a href="teacher_interviews.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-clipboard-list ml-3"></i> التقييم المبدئي والدوري</a>
            <a href="teacher_virtual_session.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-300 transition"><i class="fas fa-video ml-3"></i> غرفة الإقراء</a>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto bg-gray-50 p-8">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-gray-700">طلابي الموكلين إليّ</h2>
            <div class="relative">
                <input type="text" placeholder="ابحث عن طالب..." class="pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:border-emerald-500 w-64">
                <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <table class="w-full text-right text-sm">
                <thead class="bg-gray-50 text-gray-600 border-b">
                    <tr>
                        <th class="px-6 py-4 font-bold">اسم الطالب وبياناته</th>
                        <th class="px-6 py-4 font-bold">حالة الخطة</th>
                        <th class="px-6 py-4 font-bold text-center">الإجراءات والمتابعة</th>
                    </tr>
                </thead>
                <tbody id="myStudentsTable" class="divide-y divide-gray-100">
                    <tr><td colspan="3" class="px-6 py-8 text-center text-gray-500 font-bold">جاري تحميل بيانات الطلاب...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        window.addEventListener('load', async () => {
            const { data: { user } } = await window.supabase.auth.getUser();
            if(!user) return window.location.href = 'login.html';

            const { data, error } = await window.supabase.from('student_profiles')
                .select(`user_id, evaluation_status, users!student_profiles_user_id_fkey(full_name, email, phone)`)
                .eq('teacher_id', user.id);

            const tbody = document.getElementById('myStudentsTable');
            tbody.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(s => {
                    const planText = s.evaluation_status === 'completed' ? '<span class="text-emerald-600 font-bold">تم تقييمه وتحديد خطته</span>' : '<span class="text-red-500 font-bold">بانتظار التقييم المبدئي</span>';
                    const phone = s.users.phone || 'غير متوفر';
                    const cleanPhone = phone !== 'غير متوفر' ? phone.replace(/\D/g, '') : '';
                    const waHtml = cleanPhone ? `<a href="https://wa.me/${cleanPhone}" target="_blank" class="text-green-600 hover:text-green-800 transition font-bold"><i class="fab fa-whatsapp ml-1"></i> ${phone}</a>` : `<span class="text-gray-400">${phone}</span>`;

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="px-6 py-4">
                                <a href="teacher_student_details.html?id=${s.user_id}" class="font-bold text-emerald-700 hover:underline flex items-center mb-1 text-lg">
                                    ${s.users.full_name} <i class="fas fa-external-link-alt text-xs ml-2 opacity-70"></i>
                                </a>
                                <div class="text-xs text-gray-500 mb-1">${s.users.email}</div>
                                <div class="text-xs" dir="ltr" style="text-align: right;">${waHtml}</div>
                            </td>
                            <td class="px-6 py-4 text-sm">${planText}</td>
                            <td class="px-6 py-4 text-center">
                                <a href="teacher_student_details.html?id=${s.user_id}" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 px-4 py-2 rounded-lg font-bold transition inline-flex items-center text-xs border border-emerald-200 shadow-sm">
                                    <i class="fas fa-folder-open ml-1"></i> فتح ملف الطالب وسجل الحصص
                                </a>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-12 text-center text-gray-400 font-bold">لا يوجد لديك طلاب موكلين حالياً.</td></tr>';
            }
        });
    </script>
</body>
</html>
