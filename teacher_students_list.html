<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة المعلم - قائمة طلابي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap'); body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; } </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">
    


    <main class="flex-1 overflow-y-auto bg-gray-50 p-8">
<header class="bg-white shadow-sm p-4 flex justify-between items-center border-b z-20 sticky top-0 relative">
            <div class="flex items-center gap-3">
                <!-- زر القائمة لجميع الأجهزة -->
                <button onclick="document.getElementById('teacherMenu').classList.toggle('hidden')" class="text-gray-600 hover:text-emerald-600 focus:outline-none text-2xl transition">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 class="text-xl md:text-2xl font-bold text-gray-700">مرحباً بك، <span id="teacherName" class="text-emerald-600">...</span></h2> 
            </div>
            
            <button onclick="logout()" class="text-red-500 hover:bg-red-50 px-3 py-2 rounded-lg font-bold transition flex items-center text-sm md:text-base"><i class="fas fa-sign-out-alt ml-2"></i> خروج</button>
            
            <!-- القائمة المنسدلة للمعلم -->
            <nav id="teacherMenu" class="hidden absolute top-full right-0 w-full md:w-72 bg-[#1e293b] text-white shadow-xl flex flex-col z-50 border-t border-gray-700">
                <a href="teacher_dashboard.html" class="px-6 py-4 border-b border-gray-700 hover:bg-gray-800 transition"><i class="fas fa-home ml-3 text-emerald-400"></i> الرئيسية</a>
                <a href="teacher_students_list.html" class="px-6 py-4 border-b border-gray-700 hover:bg-gray-800 transition"><i class="fas fa-users ml-3 text-emerald-400"></i> قائمة طلابي</a>
                <a href="teacher_interviews.html" class="px-6 py-4 hover:bg-gray-800 transition"><i class="fas fa-clipboard-list ml-3 text-emerald-400"></i> التقييم المبدئي واعتماد الخطة</a>
            </nav>
        </header>
        
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-gray-700">طلابي الموكلين إليّ</h2>
            <div class="relative">
                <input type="text" placeholder="ابحث عن طالب..." class="pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:border-emerald-500 w-64">
                <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <table class="w-full text-right text-sm">
                <thead class="bg-gray-50 text-gray-600 border-b">
                    <tr>
                        <th class="px-6 py-4 font-bold">اسم الطالب وبياناته</th>
                        <th class="px-6 py-4 font-bold">حالة الخطة</th>
                        <th class="px-6 py-4 font-bold text-center">الإجراءات والمتابعة</th>
                    </tr>
                </thead>
                <tbody id="myStudentsTable" class="divide-y divide-gray-100">
                    <tr><td colspan="3" class="px-6 py-8 text-center text-gray-500 font-bold">جاري تحميل بيانات الطلاب...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="supabase.js"></script>
    <script>
        window.addEventListener('load', async () => {
            const { data: { user } } = await window.supabase.auth.getUser();
            if(!user) return window.location.href = 'login.html';

            const { data, error } = await window.supabase.from('student_profiles')
                .select(`user_id, evaluation_status, custom_plan_type, target_parts, target_surahs, users!student_profiles_user_id_fkey(full_name, email, phone)`)
                .eq('teacher_id', user.id);

            const tbody = document.getElementById('myStudentsTable');
            tbody.innerHTML = '';

            if (error) {
                tbody.innerHTML = `<tr><td colspan="3" class="px-6 py-8 text-center text-red-500 font-bold">حدث خطأ: ${error.message}</td></tr>`;
                return;
            }

            if (data && data.length > 0) {
                data.forEach(s => {
                    let planText = '<span class="text-red-500 font-bold">بانتظار التقييم المبدئي</span>';
                    
                    if (s.evaluation_status === 'completed') {
                        if(s.target_parts && s.target_parts.startsWith('[')) {
                            planText = '<span class="text-emerald-600 font-bold">تم تقييمه (خطة مخصصة متعددة)</span>';
                        } else if (s.custom_plan_type === 'parts' && s.target_parts) {
                            planText = `<span class="text-emerald-600 font-bold">تلاوة ${s.target_parts}</span>`;
                        } else if (s.custom_plan_type === 'surahs' && s.target_surahs) {
                            planText = `<span class="text-emerald-600 font-bold">سورة: ${s.target_surahs}</span>`;
                        } else {
                            planText = '<span class="text-emerald-600 font-bold">تم تقييمه وتحديد خطته</span>';
                        }
                    }

                    const phone = s.users.phone || 'غير متوفر';
                    const cleanPhone = phone !== 'غير متوفر' ? phone.replace(/\D/g, '') : '';
                    const waHtml = cleanPhone ? `<a href="https://wa.me/${cleanPhone}" target="_blank" class="text-green-600 hover:text-green-800 transition font-bold"><i class="fab fa-whatsapp ml-1"></i> ${phone}</a>` : `<span class="text-gray-400">${phone}</span>`;

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="px-6 py-4">
                                <div class="font-bold text-emerald-800 flex items-center mb-1 text-lg">
                                    ${s.users.full_name}
                                </div>
                                <div class="text-xs text-gray-500 mb-1">${s.users.email}</div>
                                <div class="text-xs" dir="ltr" style="text-align: right;">${waHtml}</div>
                            </td>
                            <td class="px-6 py-4 text-sm">${planText}</td>
                            <td class="px-6 py-4 text-center">
                                <a href="teacher_student_details.html?id=${s.user_id}" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 px-4 py-2 rounded-lg font-bold transition inline-flex items-center text-xs border border-emerald-200 shadow-sm">
                                    <i class="fas fa-folder-open ml-1"></i> فتح ملف الطالب وسجل الحصص
                                </a>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-12 text-center text-gray-400 font-bold">لا يوجد لديك طلاب موكلين حالياً.</td></tr>';
            }
        });
    </script>
</body>
</html>
